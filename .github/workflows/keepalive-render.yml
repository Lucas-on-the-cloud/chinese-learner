# Keeps the Render free-tier ig-downloader service awake by hitting /healthz
# every 10 minutes. Render free tier sleeps after 15 min of idle, so 10-min
# pings reliably prevent cold starts.
#
# GitHub Actions cron is best-effort — actual fire times can drift 5-15 min
# under load — which is fine for keep-alive but not for time-critical jobs.

name: Keep ig-downloader awake

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes (UTC)
  workflow_dispatch:           # allow manual run from Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Curl /healthz
        run: |
          curl -fsS --max-time 30 \
            https://ig-downloader-e98b.onrender.com/healthz \
            && echo "✓ Render alive"
