<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ngân hàng câu hỏi — TOCFL FAFA</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Be Vietnam Pro',sans-serif;font-size:15px;color:#1f2937;background:#f4f5f7;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}
a{text-decoration:none;color:inherit}
.zh{font-family:'Noto Sans TC',sans-serif}
[x-cloak]{display:none!important}

:root{
  --blue:#1a56db;--blue-dark:#1544b8;--blue-lt:#eff6ff;
  --orange:#f47b20;--navy:#0d1b4b;
  --purple:#7c3aed;--purple-lt:#f5f3ff;
  --green:#16a34a;--green-lt:#f0fdf4;
  --red:#dc2626;--red-lt:#fef2f2;
  --text:#1f2937;--text-2:#6b7280;--text-3:#9ca3af;
  --bg:#f4f5f7;--border:#e5e7eb;--surface:#fff;
  --shadow-sm:0 1px 3px rgba(0,0,0,.08);
  --shadow:0 4px 16px rgba(0,0,0,.1);
  --nav-h:62px;--bar-h:52px;
}

/* Navbar */
.navbar{position:sticky;top:0;z-index:300;background:#fff;border-bottom:1px solid var(--border);height:var(--nav-h);display:flex;align-items:center;box-shadow:var(--shadow-sm)}
.nb-inner{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:1200px;margin:0 auto;padding:0 1.5rem}
.nav-brand{display:flex;align-items:center;gap:10px}
.nav-brand img{height:32px;border-radius:5px}
.nav-brand-text{font-family:'Noto Sans TC',sans-serif;font-size:18px;font-weight:700;color:var(--navy)}
.nav-brand-text em{color:var(--orange);font-style:normal}
.nav-menu{display:flex;align-items:center;gap:2px}
.nav-link{font-size:14px;font-weight:500;color:var(--text-2);padding:6px 12px;border-radius:6px;transition:.15s;text-decoration:none;white-space:nowrap}
.nav-link:hover{color:var(--text);background:#f3f4f6}
.nav-link.active{color:var(--blue);font-weight:600}

/* Top bar */
.top-bar{position:sticky;top:var(--nav-h);z-index:200;background:#fff;border-bottom:1px solid var(--border);box-shadow:var(--shadow-sm);height:var(--bar-h)}
.tb-inner{padding:0 1.5rem;display:flex;align-items:center;height:100%;gap:10px;max-width:1200px;margin:0 auto;overflow-x:auto}
.tb-back{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-3);transition:.15s;white-space:nowrap;text-decoration:none;flex-shrink:0;padding:6px 10px;border-radius:6px;border:1px solid var(--border)}
.tb-back:hover{color:var(--blue);border-color:var(--blue)}
.tb-sep{width:1px;height:20px;background:var(--border);flex-shrink:0}
.tb-title{font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;flex-shrink:0}
.tb-parts{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tb-parts::-webkit-scrollbar{display:none}
.tb-part-btn{font-size:12px;font-weight:600;padding:5px 14px;border-radius:20px;border:1.5px solid var(--border);background:transparent;color:var(--text-2);cursor:pointer;transition:.12s;font-family:inherit;white-space:nowrap;flex-shrink:0}
.tb-part-btn:hover{border-color:var(--blue);color:var(--blue)}
.tb-part-btn.active{border-color:var(--blue);color:var(--blue);background:var(--blue-lt)}
.tb-count{font-size:12px;color:var(--text-3);white-space:nowrap;margin-left:auto;flex-shrink:0}

/* Layout */
.qb-layout{display:flex;flex:1;align-items:flex-start;max-width:1200px;margin:0 auto;width:100%}

/* Sidebar */
.qb-sidebar{width:200px;flex-shrink:0;background:#fff;border-right:1px solid var(--border);padding:14px 10px;position:sticky;top:calc(var(--nav-h) + var(--bar-h));height:calc(100vh - var(--nav-h) - var(--bar-h));overflow-y:auto;scrollbar-width:thin;scrollbar-color:#e5e7eb transparent}
.sb-title{font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;padding:0 2px}
.sb-progress{font-size:11px;color:var(--text-3);margin-bottom:12px;padding:0 2px}
.sb-progress strong{color:var(--blue)}
.sb-group-btn{display:block;width:100%;text-align:left;font-size:12px;padding:7px 10px;border-radius:8px;border:none;background:transparent;color:var(--text-2);cursor:pointer;font-family:inherit;transition:.12s;position:relative;display:flex;align-items:center;gap:6px}
.sb-group-btn:hover{background:#f3f4f6}
.sb-group-btn.active{background:var(--blue-lt);color:var(--blue);font-weight:600}
.sb-group-btn.done{color:var(--green)}
.sb-group-btn.done::after{content:'✓';font-size:11px;color:var(--green);margin-left:auto;flex-shrink:0}
.sb-group-num{width:22px;height:22px;border-radius:6px;background:#f3f4f6;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-group-btn.active .sb-group-num{background:var(--blue);color:#fff}
.sb-group-btn.done .sb-group-num{background:var(--green-lt);color:var(--green)}
.sb-group-label{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1;font-size:11.5px}

/* Main content */
.qb-main{flex:1;min-width:0;padding:24px 28px 64px}

/* Loading */
.qb-loading{display:flex;align-items:center;justify-content:center;flex:1;padding:4rem;color:var(--text-3);font-size:14px;gap:10px}

/* Group card */
.group-card{background:#fff;border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:20px}
.gc-head{padding:14px 20px;border-bottom:1px solid #f3f4f6;display:flex;align-items:center;gap:10px;background:#fafbfc}
.gc-part-badge{font-size:10px;font-weight:700;padding:2px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px}
.gc-part-badge.listening{background:var(--purple-lt);color:var(--purple)}
.gc-part-badge.reading{background:var(--blue-lt);color:var(--blue)}
.gc-group-num{font-size:12px;color:var(--text-3)}

/* Audio player */
.audio-block{padding:14px 20px;border-bottom:1px solid #f3f4f6;display:flex;align-items:center;gap:10px;background:#fafbfc}
.audio-btn{width:36px;height:36px;border-radius:50%;background:var(--purple);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:.15s;flex-shrink:0}
.audio-btn:hover{background:#6d28d9}
.audio-label{font-size:12px;color:var(--text-3)}
.q-audio-btn{width:26px;height:26px;border-radius:50%;background:var(--purple-lt);color:var(--purple);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;transition:.15s;flex-shrink:0;vertical-align:middle;margin-right:4px}
.q-audio-btn:hover{background:var(--purple);color:#fff}

/* Passage */
.passage-block{padding:24px 28px;border-bottom:1px solid #f3f4f6;font-family:'Noto Sans TC',sans-serif;font-size:19px;line-height:2.3;color:#111;letter-spacing:.03em;white-space:pre-line}
.passage-label{font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;font-family:'Be Vietnam Pro',sans-serif}

/* Questions */
.questions-block{padding:24px}
.question-item{margin-bottom:28px;padding-bottom:28px;border-bottom:1px solid #f3f4f6}
.question-item:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none}
.q-num{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:#f3f4f6;font-size:13px;font-weight:700;color:var(--text-2);margin-right:10px;flex-shrink:0;vertical-align:middle}
.q-text{font-family:'Noto Sans TC',sans-serif;font-size:18.5px;line-height:2.1;letter-spacing:.03em;color:#111;margin-bottom:18px}
.q-text-wrap{display:flex;align-items:flex-start;gap:0;margin-bottom:16px}

/* Options */
.options-list{display:flex;flex-direction:column;gap:9px}
.opt-btn{width:100%;text-align:left;padding:13px 18px;border:1.5px solid var(--border);border-radius:10px;background:#fff;cursor:pointer;font-family:'Noto Sans TC',sans-serif;font-size:17.5px;letter-spacing:.03em;color:var(--text);transition:.12s;display:flex;align-items:baseline;gap:14px}
.opt-btn:not([disabled]):hover{border-color:var(--blue);background:var(--blue-lt);color:var(--blue)}
.opt-btn[disabled]{cursor:default}
.opt-btn.selected{border-color:var(--blue);background:var(--blue-lt);color:var(--blue)}
.opt-btn.correct{border-color:var(--green)!important;background:var(--green-lt)!important;color:var(--green)!important}
.opt-btn.wrong{border-color:var(--red)!important;background:var(--red-lt)!important;color:var(--red)!important}
.opt-label{font-size:13px;font-weight:700;min-width:22px;flex-shrink:0;color:var(--text-3)}

/* Translation */
.translate-btn{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;border:1.5px solid #d1d5db;background:#fff;color:var(--text-2);cursor:pointer;font-family:'Be Vietnam Pro',sans-serif;transition:.12s;flex-shrink:0}
.translate-btn:hover{border-color:var(--blue);color:var(--blue)}
.translate-btn.active{border-color:var(--blue);background:var(--blue-lt);color:var(--blue)}
.translate-btn i{font-size:11px}
.translation-box{margin-top:14px;padding:14px 16px;background:#fffbeb;border:1.5px solid #fde68a;border-radius:10px;font-size:15px;line-height:1.85;color:#78350f;font-family:'Be Vietnam Pro',sans-serif}
.translation-label{font-size:10px;font-weight:700;color:#92400e;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.translation-passage{margin-top:12px;padding:16px 18px;background:#fffbeb;border:1.5px solid #fde68a;border-radius:10px;font-size:15px;line-height:1.85;color:#78350f;font-family:'Be Vietnam Pro',sans-serif;border-top:none;border-top-left-radius:0;border-top-right-radius:0}
.passage-translate-bar{padding:8px 28px 14px;display:flex;align-items:center;gap:8px;background:#fff}
.q-translation{margin-top:10px;padding:10px 14px;background:#fffbeb;border:1.5px solid #fde68a;border-radius:8px;font-size:14.5px;line-height:1.8;color:#78350f;font-family:'Be Vietnam Pro',sans-serif}

/* Image passages */
.passage-img{width:100%;border-radius:8px;display:block;cursor:zoom-in}
.questions-img-block{padding:0 28px 20px;background:#fff}
.questions-img-block img{width:100%;border-radius:8px;display:block;border:1px solid var(--border);cursor:zoom-in}
.img-q-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.img-q-num{min-width:32px;font-size:13px;font-weight:700;color:var(--text-3);flex-shrink:0}

/* Result badge on question */
.q-result{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 10px;border-radius:20px;margin-left:8px;vertical-align:middle}
.q-result.correct{background:var(--green-lt);color:var(--green)}
.q-result.wrong{background:var(--red-lt);color:var(--red)}

/* Navigation */
.group-nav{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-top:1px solid #f3f4f6;background:#fafbfc}
.nav-btn-prev,.nav-btn-next{font-size:13px;font-weight:600;padding:8px 18px;border-radius:8px;border:1.5px solid var(--border);background:#fff;color:var(--text-2);cursor:pointer;font-family:inherit;transition:.12s;display:flex;align-items:center;gap:6px}
.nav-btn-prev:hover:not([disabled]),.nav-btn-next:hover:not([disabled]){border-color:var(--blue);color:var(--blue);background:var(--blue-lt)}
.nav-btn-prev[disabled],.nav-btn-next[disabled]{opacity:.35;cursor:default}
.nav-center{font-size:12px;color:var(--text-3)}
.nav-center strong{color:var(--blue)}

/* Group done banner */
.group-done{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;background:var(--green-lt);color:var(--green);font-size:13px;font-weight:600;border-top:1px solid #bbf7d0}
.group-done i{font-size:14px}

/* Setup page */
.sp-page{flex:1;background:var(--bg)}
.sp-hero{background:linear-gradient(135deg,var(--navy),#1e3a8a);padding:28px 0;position:relative;overflow:hidden}
.sp-hero::before{content:'題';position:absolute;font-family:'Noto Sans TC',sans-serif;font-size:260px;font-weight:700;color:rgba(255,255,255,.06);bottom:-60px;right:40px;line-height:1;pointer-events:none}
.sp-hero-inner{max-width:900px;margin:0 auto;padding:0 28px;display:flex;align-items:center;justify-content:space-between;gap:20px;position:relative;z-index:1}
.sp-hero-text{}
.sp-title{font-family:'Noto Sans TC',sans-serif;font-size:22px;font-weight:700;color:#fff;margin-bottom:4px}
.sp-sub{font-size:13px;color:rgba(255,255,255,.6)}
.sp-band-toggle{display:flex;gap:4px;background:rgba(255,255,255,.12);border-radius:10px;padding:4px}
.sp-band-btn{padding:7px 18px;border-radius:7px;border:none;background:transparent;color:rgba(255,255,255,.65);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.sp-band-btn:hover{color:#fff}
.sp-band-btn.active{background:#fff;color:var(--navy)}
.sp-body{max-width:900px;margin:0 auto;padding:28px 28px 60px}
.sp-section{margin-bottom:28px}
.sp-section-label{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px}
.sp-section-label i{font-size:12px}
.sp-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sp-card{background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:18px 20px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:.15s;position:relative;overflow:hidden}
.sp-card:hover{border-color:var(--blue);box-shadow:0 4px 20px rgba(26,86,219,.1);transform:translateY(-1px)}
.sp-card.loading{opacity:.6;pointer-events:none}
.sp-card-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.sp-card-icon.listening{background:var(--purple-lt);color:var(--purple)}
.sp-card-icon.reading{background:var(--blue-lt);color:var(--blue)}
.sp-card-body{flex:1;min-width:0}
.sp-card-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:3px}
.sp-card-meta{font-size:12px;color:var(--text-3)}
.sp-card-arrow{font-size:16px;color:var(--text-3);flex-shrink:0;transition:.15s}
.sp-card:hover .sp-card-arrow{color:var(--blue);transform:translateX(3px)}
.sp-loading{text-align:center;padding:40px;color:var(--text-3);font-size:14px}
@media(max-width:540px){.sp-cards{grid-template-columns:1fr}}

@media(max-width:768px){
  .qb-sidebar{display:none}
  .qb-main{padding:16px 16px 64px}
  .nav-link{display:none}
}

/* Text-selection translation popup */
#sel-popup{position:fixed;z-index:9999;display:none;pointer-events:none;transform:translateX(-50%) translateY(-100%)}
#sel-popup-inner{position:relative;filter:drop-shadow(0 4px 18px rgba(0,0,0,.28))}
#sel-popup-content{background:#1e293b;color:#f8fafc;border-radius:10px;padding:9px 14px;font-size:14px;font-family:'Be Vietnam Pro',sans-serif;line-height:1.7;max-width:300px;min-width:100px;word-wrap:break-word;pointer-events:auto;cursor:default}
#sel-popup-arrow{width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:8px solid #1e293b;margin:0 auto}
.sel-loader{display:inline-block;width:11px;height:11px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:selSpin .65s linear infinite;margin-right:6px;vertical-align:middle}
@keyframes selSpin{to{transform:rotate(360deg)}}
</style>
</head>
<body x-data="qbankApp()" x-init="init()" x-cloak>

<!-- Navbar -->
<nav class="navbar">
  <div class="nb-inner">
    <a class="nav-brand" href="/courses.html">
      <img src="images/logo.jpg" alt="TOCFL FAFA" onerror="this.style.display='none'">
      <span class="nav-brand-text">TOCFL <em>FAFA</em></span>
    </a>
    <div class="nav-menu">
      <a class="nav-link" href="/flashcards.html">Flashcard</a>
      <a class="nav-link active" href="/courses.html">Khóa học</a>
      <a class="nav-link" href="/vocab.html">Từ vựng</a>
      <a class="nav-link" href="/exams.html">Đề thi</a>
    </div>
  </div>
</nav>

<!-- Setup page -->
<div class="sp-page" x-show="view === 'setup'">
  <!-- Hero -->
  <div class="sp-hero">
    <div class="sp-hero-inner">
      <div class="sp-hero-text">
        <div class="sp-title zh">題庫練習</div>
        <div class="sp-sub">Luyện tập không giới hạn thời gian — đáp án ngay lập tức</div>
      </div>
      <div class="sp-band-toggle">
        <button class="sp-band-btn" :class="selectedBand==='QB-B'?'active':''" @click="changeBand('QB-B')">Band B</button>
        <button class="sp-band-btn" :class="selectedBand==='QB-C'?'active':''" @click="changeBand('QB-C')">Band C</button>
      </div>
    </div>
  </div>

  <!-- Body -->
  <div class="sp-body">
    <!-- Loading state -->
    <div class="sp-loading" x-show="loadingBand">
      <i class="fas fa-spinner fa-spin" style="margin-right:6px"></i> Đang tải...
    </div>

    <template x-if="!loadingBand">
      <div>
        <!-- Nghe section -->
        <div class="sp-section">
          <div class="sp-section-label">
            <i class="fas fa-headphones"></i> Nghe
          </div>
          <div class="sp-cards">
            <!-- Đối thoại -->
            <div class="sp-card" :class="loadingPart===1?'loading':''" @click="startPractice(1)">
              <div class="sp-card-icon listening"><i class="fas fa-comments"></i></div>
              <div class="sp-card-body">
                <div class="sp-card-title">Đối thoại</div>
                <div class="sp-card-meta" x-text="partStat(1)"></div>
              </div>
              <div class="sp-card-arrow">
                <i class="fas" :class="loadingPart===1?'fa-spinner fa-spin':'fa-chevron-right'" style="font-size:13px"></i>
              </div>
            </div>
            <!-- Đoạn văn -->
            <div class="sp-card" :class="loadingPart===2?'loading':''" @click="startPractice(2)">
              <div class="sp-card-icon listening"><i class="fas fa-volume-up"></i></div>
              <div class="sp-card-body">
                <div class="sp-card-title">Đoạn văn nghe</div>
                <div class="sp-card-meta" x-text="partStat(2)"></div>
              </div>
              <div class="sp-card-arrow">
                <i class="fas" :class="loadingPart===2?'fa-spinner fa-spin':'fa-chevron-right'" style="font-size:13px"></i>
              </div>
            </div>
          </div>
        </div>

        <!-- Đọc section -->
        <div class="sp-section">
          <div class="sp-section-label">
            <i class="fas fa-book-open"></i> Đọc
          </div>
          <div class="sp-cards">
            <!-- Điền từ -->
            <div class="sp-card" :class="loadingPart===3?'loading':''" @click="startPractice(3)">
              <div class="sp-card-icon reading"><i class="fas fa-pen-nib"></i></div>
              <div class="sp-card-body">
                <div class="sp-card-title">Điền từ</div>
                <div class="sp-card-meta" x-text="partStat(3)"></div>
              </div>
              <div class="sp-card-arrow">
                <i class="fas" :class="loadingPart===3?'fa-spinner fa-spin':'fa-chevron-right'" style="font-size:13px"></i>
              </div>
            </div>
            <!-- Đọc hiểu -->
            <div class="sp-card" :class="loadingPart===4?'loading':''" @click="startPractice(4)">
              <div class="sp-card-icon reading"><i class="fas fa-file-alt"></i></div>
              <div class="sp-card-body">
                <div class="sp-card-title">Đọc hiểu</div>
                <div class="sp-card-meta" x-text="partStat(4)"></div>
              </div>
              <div class="sp-card-arrow">
                <i class="fas" :class="loadingPart===4?'fa-spinner fa-spin':'fa-chevron-right'" style="font-size:13px"></i>
              </div>
            </div>
          </div>
        </div>
      </div>
    </template>
  </div>
</div>

<!-- Practice view -->
<template x-if="view === 'practice'">
  <div style="display:flex;flex-direction:column;flex:1">
    <!-- Top bar -->
    <div class="top-bar">
      <div class="tb-inner">
        <button class="tb-back" @click="backToSetup()">
          <i class="fas fa-chevron-left" style="font-size:10px"></i> Dạng bài
        </button>
        <div class="tb-sep"></div>
        <div class="tb-title" x-text="activePart ? partLabel(activePart) : ''"></div>
        <div class="tb-sep"></div>
        <div style="font-size:12px;color:var(--text-3);white-space:nowrap;flex-shrink:0">
          <span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:12px;background:var(--blue-lt);color:var(--blue)" x-text="selectedBand.replace('QB-','Band ')"></span>
        </div>
        <div class="tb-count" x-show="activePart">
          <strong x-text="(activeGroupIdx+1)"></strong>/<span x-text="activePart?.groups?.length||0"></span> nhóm
        </div>
      </div>
    </div>

    <!-- Body -->
    <div class="qb-layout">
      <!-- Sidebar -->
      <div class="qb-sidebar">
        <div class="sb-title">Danh sách nhóm</div>
        <div class="sb-progress" x-show="activePart">
          <strong x-text="doneCount()"></strong>/<span x-text="activePart?.groups?.length||0"></span> hoàn thành
        </div>
        <template x-if="activePart">
          <div>
            <template x-for="(g, idx) in activePart.groups" :key="g.id">
              <button class="sb-group-btn"
                :class="{'active': activeGroupIdx===idx, 'done': isGroupDone(g)}"
                @click="goToGroup(idx)">
                <span class="sb-group-num" x-text="idx+1"></span>
                <span class="sb-group-label zh" x-text="groupLabel(g, idx)"></span>
              </button>
            </template>
          </div>
        </template>
      </div>

      <!-- Main -->
      <div class="qb-main">
        <template x-if="activePart && activeGroup">
          <div class="group-card">
            <!-- Card header -->
            <div class="gc-head">
              <span class="gc-part-badge" :class="activePart.skill==='Listening'?'listening':'reading'"
                x-text="activePart.skill==='Listening'?'Nghe':'Đọc'"></span>
              <span class="gc-part-badge" style="background:#f3f4f6;color:var(--text-2)"
                x-text="partLabel(activePart)"></span>
              <span class="gc-group-num">Nhóm <strong x-text="activeGroupIdx+1"></strong></span>
            </div>

            <!-- Group audio (if listening) -->
            <template x-if="activeGroup.shared_audio_url">
              <div class="audio-block">
                <button class="audio-btn" @click="playAudio(activeGroup.shared_audio_url, 'group')"
                  :title="playingId==='group'?'Đang phát...':'Nghe bài'">
                  <i class="fas" :class="playingId==='group'?'fa-volume-up':'fa-play'"></i>
                </button>
                <span class="audio-label">
                  <span x-show="playingId==='group'" style="color:var(--purple);font-weight:600">Đang phát...</span>
                  <span x-show="playingId!=='group'">Nhấn để nghe bài</span>
                </span>
              </div>
            </template>

            <!-- Passage image (PNG-only groups) -->
            <template x-if="activeGroup.shared_image_url">
              <div style="padding:20px 28px 0">
                <img class="passage-img" :src="activeGroup.shared_image_url" alt="Đoạn văn"
                  @click="window.open(activeGroup.shared_image_url,'_blank')">
              </div>
            </template>

            <!-- Passage text (TXT groups) -->
            <template x-if="activeGroup.shared_text">
              <div>
                <div class="passage-block">
                  <div class="passage-label" style="display:flex;align-items:center;justify-content:space-between">
                    <span>Nội dung bài</span>
                    <button class="translate-btn"
                      :class="showTrans[activeGroup.id] ? 'active' : ''"
                      :disabled="translating[activeGroup.id]"
                      @click="toggleTranslation(activeGroup)">
                      <i class="fas" :class="translating[activeGroup.id] ? 'fa-spinner fa-spin' : 'fa-language'"></i>
                      <span x-text="showTrans[activeGroup.id] ? 'Ẩn dịch' : (translating[activeGroup.id] ? 'Đang dịch...' : 'Dịch tiếng Việt')"></span>
                    </button>
                  </div>
                  <div style="margin-top:12px" x-text="activeGroup.shared_text"></div>
                  <template x-if="showTrans[activeGroup.id] && tranCache[activeGroup.id]?.passage">
                    <div class="translation-passage">
                      <div class="translation-label">Bản dịch tiếng Việt</div>
                      <div x-text="tranCache[activeGroup.id].passage"></div>
                    </div>
                  </template>
                </div>
              </div>
            </template>

            <!-- Questions image (first question carries the URL for PNG groups) -->
            <template x-if="activeGroup.tocfl_questions?.[0]?.question_image_url">
              <div class="questions-img-block">
                <img :src="activeGroup.tocfl_questions[0].question_image_url" alt="Câu hỏi"
                  @click="window.open(activeGroup.tocfl_questions[0].question_image_url,'_blank')">
              </div>
            </template>

            <!-- Questions -->
            <div class="questions-block">
              <template x-for="q in activeGroup.tocfl_questions" :key="q.id">
                <div class="question-item">
                  <!-- Question header -->
                  <div class="q-text-wrap">
                    <template x-if="q.question_audio_url">
                      <button class="q-audio-btn" @click="playAudio(q.question_audio_url, 'q'+q.id)">
                        <i class="fas" :class="playingId==='q'+q.id?'fa-volume-up':'fa-play'"></i>
                      </button>
                    </template>
                    <span class="q-num" x-text="q.question_num"></span>
                    <span class="q-text zh" x-show="q.question_text" x-text="q.question_text" style="display:inline"></span>
                    <template x-if="answers[q.id]">
                      <span class="q-result" :class="results[q.id]?'correct':'wrong'">
                        <i class="fas" :class="results[q.id]?'fa-check':'fa-times'"></i>
                        <span x-text="results[q.id]?'Đúng':'Sai'"></span>
                      </span>
                    </template>
                  </div>
                  <!-- Question translation (TXT groups only) -->
                  <template x-if="showTrans[activeGroup.id] && tranCache[activeGroup.id]?.questions?.[q.id]">
                    <div class="q-translation" x-text="tranCache[activeGroup.id].questions[q.id]"></div>
                  </template>

                  <!-- Options: PNG groups show label-only buttons; TXT groups show full text -->
                  <template x-if="activeGroup.shared_image_url">
                    <div style="display:flex;gap:10px;flex-wrap:wrap">
                      <template x-for="opt in q.tocfl_options" :key="opt.id">
                        <button class="opt-btn" style="width:auto;padding:10px 22px;font-size:16px;font-weight:700"
                          :class="{
                            'correct': answers[q.id] && opt.is_correct,
                            'wrong':   answers[q.id] && answers[q.id]===opt.label && !opt.is_correct
                          }"
                          :disabled="!!answers[q.id]"
                          @click="selectAnswer(q.id, opt.label, opt.is_correct)">
                          <span class="zh" x-text="opt.label"></span>
                        </button>
                      </template>
                    </div>
                  </template>
                  <template x-if="!activeGroup.shared_image_url">
                    <div class="options-list">
                      <template x-for="opt in q.tocfl_options" :key="opt.id">
                        <button class="opt-btn"
                          :class="{
                            'correct': answers[q.id] && opt.is_correct,
                            'wrong':   answers[q.id] && answers[q.id]===opt.label && !opt.is_correct,
                            'selected': answers[q.id]===opt.label && !answers[q.id]
                          }"
                          :disabled="!!answers[q.id]"
                          @click="selectAnswer(q.id, opt.label, opt.is_correct)">
                          <span class="opt-label zh" x-text="opt.label"></span>
                          <span class="zh" x-text="opt.text"></span>
                        </button>
                      </template>
                    </div>
                  </template>
                </div>
              </template>
            </div>

            <!-- Done banner -->
            <template x-if="isGroupDone(activeGroup)">
              <div class="group-done">
                <i class="fas fa-check-circle"></i>
                Đã hoàn thành nhóm này —
                <strong x-text="groupScore(activeGroup)"></strong>/<span x-text="activeGroup.tocfl_questions.length"></span> câu đúng
              </div>
            </template>

            <!-- Navigation -->
            <div class="group-nav">
              <button class="nav-btn-prev" :disabled="activeGroupIdx===0" @click="prevGroup()">
                <i class="fas fa-chevron-left" style="font-size:10px"></i> Nhóm trước
              </button>
              <span class="nav-center">
                <strong x-text="activeGroupIdx+1"></strong> / <span x-text="activePart?.groups?.length||0"></span>
              </span>
              <button class="nav-btn-next"
                :disabled="activeGroupIdx>=(activePart?.groups?.length||1)-1"
                @click="nextGroup()">
                Nhóm sau <i class="fas fa-chevron-right" style="font-size:10px"></i>
              </button>
            </div>
          </div>
        </template>

        <!-- Part empty -->
        <template x-if="!activePart">
          <div style="text-align:center;padding:4rem;color:var(--text-3);font-size:14px">
            Chọn dạng bài ở trên để bắt đầu.
          </div>
        </template>
      </div>
    </div>
  </div>
</template>

<!-- Hidden audio element -->
<audio id="qb-audio" preload="none"></audio>

<!-- Text-selection translation popup -->
<div id="sel-popup">
  <div id="sel-popup-inner">
    <div id="sel-popup-content">
      <span id="sel-popup-icon"></span><span id="sel-popup-text">Đang dịch...</span>
    </div>
    <div id="sel-popup-arrow"></div>
  </div>
</div>

<script>
const _DB_URL = 'https://prctmferugkxabyizslx.supabase.co';
const _DB_KEY = 'sb_publishable_6-_0uUkFDKDCA4HBNdB0Gg_ZEL_GqJQ';
const _db = supabase.createClient(_DB_URL, _DB_KEY);

function qbankApp() {
  return {
    view: 'setup',
    selectedBand: 'QB-C',
    partsInfo: [],      // [{id, part_number, skill, instruction, question_count}]
    loadingBand: false,
    loadingPart: null,  // part_number being loaded

    exam: null,
    parts: [],
    activePart: null,
    activeGroupIdx: 0,
    answers: {},
    results: {},

    tranCache: {},
    showTrans: {},
    translating: {},

    playingId: null,
    _audio: null,

    get activeGroup() {
      return this.activePart?.groups?.[this.activeGroupIdx] || null;
    },

    async init() {
      const band = new URLSearchParams(location.search).get('band') || 'QB-C';
      this.selectedBand = band;
      this._audio = document.getElementById('qb-audio');
      this._audio.addEventListener('ended', () => { this.playingId = null; });
      await this.loadBandInfo(band);
    },

    async loadBandInfo(band) {
      this.loadingBand = true;
      const { data: examData } = await _db.from('tocfl_exams')
        .select('id,title,band,total_questions').eq('band', band).single();
      if (examData) {
        this.exam = examData;
        const { data: pi } = await _db.from('tocfl_parts')
          .select('id,part_number,skill,instruction,question_count')
          .eq('exam_id', examData.id).order('part_number');
        this.partsInfo = pi || [];
      }
      this.loadingBand = false;
    },

    async changeBand(band) {
      if (this.selectedBand === band || this.loadingBand) return;
      this.selectedBand = band;
      this.partsInfo = [];
      await this.loadBandInfo(band);
    },

    async startPractice(partNum) {
      if (this.loadingPart) return;
      this.loadingPart = partNum;

      // Find the part from partsInfo
      const partInfo = this.partsInfo.find(p => p.part_number === partNum);
      if (!partInfo) { this.loadingPart = null; return; }

      // Load groups + questions + options for this part only
      const { data: groupsData } = await _db.from('tocfl_groups')
        .select(`id, part_id, order_num, shared_text, shared_audio_url, shared_image_url,
          tocfl_questions(id, question_num, question_text, question_audio_url, question_image_url,
            tocfl_options(id, label, text, is_correct))`)
        .eq('part_id', partInfo.id)
        .order('order_num');

      for (const g of (groupsData || [])) {
        g.tocfl_questions = (g.tocfl_questions || []).sort((a,b) => a.question_num - b.question_num);
        for (const q of g.tocfl_questions) {
          q.tocfl_options = (q.tocfl_options || []).sort((a,b) => a.label.localeCompare(b.label));
        }
      }

      const part = { ...partInfo, groups: groupsData || [] };
      this.parts = [part];
      this.answers = {};
      this.results = {};
      this.tranCache = {};
      this.showTrans = {};
      this.translating = {};
      this.loadingPart = null;
      this.view = 'practice';
      this.selectPart(part);
    },

    backToSetup() {
      this.stopAudio();
      this.view = 'setup';
    },

    selectPart(part) {
      this.activePart = part;
      this.activeGroupIdx = 0;
      this.stopAudio();
      this.$nextTick(() => window.scrollTo(0, 0));
    },

    goToGroup(idx) {
      this.activeGroupIdx = idx;
      this.stopAudio();
      this.$nextTick(() => window.scrollTo(0, 0));
    },

    nextGroup() {
      if (this.activeGroupIdx < (this.activePart?.groups?.length || 0) - 1) {
        this.activeGroupIdx++;
        this.stopAudio();
        window.scrollTo(0, 0);
      }
    },

    prevGroup() {
      if (this.activeGroupIdx > 0) {
        this.activeGroupIdx--;
        this.stopAudio();
        window.scrollTo(0, 0);
      }
    },

    selectAnswer(qId, label, isCorrect) {
      if (this.answers[qId]) return;
      this.answers[qId] = label;
      this.results[qId] = isCorrect;
    },

    isGroupDone(group) {
      if (!group?.tocfl_questions?.length) return false;
      return group.tocfl_questions.every(q => this.answers[q.id]);
    },

    groupScore(group) {
      return (group?.tocfl_questions || []).filter(q => this.results[q.id]).length;
    },

    doneCount() {
      return (this.activePart?.groups || []).filter(g => this.isGroupDone(g)).length;
    },

    playAudio(url, id) {
      if (this.playingId === id) {
        this._audio.pause();
        this.playingId = null;
        return;
      }
      this._audio.src = url;
      this._audio.play().catch(() => {});
      this.playingId = id;
    },

    stopAudio() {
      this._audio?.pause();
      this.playingId = null;
    },

    async toggleTranslation(group) {
      const id = group.id;
      // Already cached → just toggle visibility
      if (this.tranCache[id]) {
        this.showTrans = { ...this.showTrans, [id]: !this.showTrans[id] };
        return;
      }
      // Mark as translating (spread to trigger Alpine reactivity)
      this.translating = { ...this.translating, [id]: true };
      try {
        const passage = group.shared_text || '';
        const questions = (group.tocfl_questions || []).filter(q => q.question_text);

        // Parallel requests — more reliable than batching (separator gets translated)
        const [passageTrans, ...qTransArr] = await Promise.all([
          passage ? this._gtranslate(passage) : Promise.resolve(''),
          ...questions.map(q => this._gtranslate(q.question_text)),
        ]);

        const qTrans = {};
        questions.forEach((q, i) => { qTrans[q.id] = qTransArr[i] || ''; });

        // Spread assignment → Alpine detects new keys
        this.tranCache  = { ...this.tranCache,  [id]: { passage: passageTrans, questions: qTrans } };
        this.showTrans  = { ...this.showTrans,  [id]: true };
      } catch (e) {
        console.error('Translation error:', e);
        alert('Dịch thất bại — Google Translate bị giới hạn. Thử lại sau.');
      }
      this.translating = { ...this.translating, [id]: false };
    },

    async _gtranslate(text) {
      // Split into ≤500-char chunks at sentence boundaries (MyMemory limit)
      const MAX = 490;
      if (text.length <= MAX) return this._myMemory(text);
      const chunks = [];
      let cur = '';
      for (const seg of text.split(/(?<=[。！？\n])/)) {
        if ((cur + seg).length > MAX && cur) { chunks.push(cur); cur = seg; }
        else cur += seg;
      }
      if (cur) chunks.push(cur);
      const parts = await Promise.all(chunks.map(c => this._myMemory(c)));
      return parts.join('');
    },

    async _myMemory(text) {
      const url = 'https://api.mymemory.translated.net/get'
        + '?q=' + encodeURIComponent(text.trim())
        + '&langpair=zh-TW|vi';
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (!data.responseData?.translatedText) throw new Error(data.responseDetails || 'No translation');
      return data.responseData.translatedText;
    },

    partLabel(p) {
      const labels = { 1:'Đối thoại', 2:'Đoạn văn nghe', 3:'Điền từ', 4:'Đọc hiểu' };
      return labels[p.part_number] || p.instruction;
    },

    partStat(num) {
      const p = this.partsInfo.find(x => x.part_number === num);
      if (!p) return '…';
      return `${p.question_count} câu`;
    },

    groupLabel(g, idx) {
      // First few words of shared_text as label
      const txt = g.shared_text || '';
      const short = txt.replace(/\n/g,' ').trim().slice(0, 18);
      return short || `Nhóm ${idx+1}`;
    },
  };
}

// Text-selection popup — translate highlighted Chinese text on mouseup
(function () {
  const popup  = document.getElementById('sel-popup');
  const icon   = document.getElementById('sel-popup-icon');
  const label  = document.getElementById('sel-popup-text');

  function show(rect) {
    popup.style.left = (rect.left + rect.width / 2) + 'px';
    popup.style.top  = (rect.top - 10) + 'px';
    popup.style.display = 'block';
  }

  function hide() { popup.style.display = 'none'; }

  async function myMemory(text) {
    const url = 'https://api.mymemory.translated.net/get'
      + '?q=' + encodeURIComponent(text.slice(0, 490))
      + '&langpair=zh-TW|vi';
    const r = await fetch(url);
    const d = await r.json();
    return d.responseData?.translatedText || '(không dịch được)';
  }

  document.addEventListener('mouseup', async function (e) {
    const sel = window.getSelection();
    const txt = sel?.toString().trim();
    if (!txt || txt.length < 2) { hide(); return; }

    // Only fire inside passage or question text areas
    const range = sel.getRangeAt(0);
    const anc = range.commonAncestorContainer;
    const el = anc.nodeType === Node.TEXT_NODE ? anc.parentElement : anc;
    if (!el.closest('.passage-block, .questions-block')) { hide(); return; }

    const rect = range.getBoundingClientRect();
    icon.className = 'sel-loader';
    icon.textContent = '';
    label.textContent = 'Đang dịch...';
    show(rect);

    try {
      const result = await myMemory(txt);
      icon.className = '';
      icon.textContent = '';
      label.textContent = result;
    } catch (_) {
      icon.className = '';
      label.textContent = '(Lỗi kết nối)';
    }
  });

  // Hide on click outside popup
  document.addEventListener('mousedown', function (e) {
    if (!popup.contains(e.target)) hide();
  });

  // Hide on scroll so it doesn't drift
  window.addEventListener('scroll', hide, { passive: true });
})();
</script>
</body>
</html>
