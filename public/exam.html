<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luyện đề thi — TOCFL FAFA</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: {
    colors: {
      navy:   '#0d1b4b',
      blue:   { DEFAULT:'#1a56db', dark:'#1544b8', lt:'#eff6ff' },
      orange: '#f47b20',
      purple: { DEFAULT:'#7c3aed', lt:'#f5f3ff' },
      green:  { DEFAULT:'#16a34a', lt:'#f0fdf4' },
    },
    fontFamily: { serif:['"Noto Serif TC"','serif'], sans:['"Be Vietnam Pro"','sans-serif'] },
  }}
}
</script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/auth-service.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Be Vietnam Pro',sans-serif;-webkit-font-smoothing:antialiased}
.zh{font-family:'Noto Serif TC',serif}

/* Choice button states */
.choice-btn            {transition:all .12s;text-align:left;cursor:pointer}
.choice-btn.selected   {border-color:#1a56db!important;background:#eff6ff!important;color:#1a56db}
.choice-btn.selected .lbl{color:#1a56db}
.choice-btn.c-correct  {border-color:#16a34a!important;background:#f0fdf4!important;color:#166534}
.choice-btn.c-correct .lbl{color:#16a34a}
.choice-btn.c-wrong    {border-color:#dc2626!important;background:#fef2f2!important;color:#dc2626}
.choice-btn.c-wrong .lbl{color:#dc2626}
.choice-btn.c-miss     {border-color:#16a34a!important;border-style:dashed!important;color:#166534}
.choice-btn.c-miss .lbl{color:#16a34a}

/* Passage block */
.passage-block{background:linear-gradient(135deg,#f0fdf4,#dcfce7);border:1.5px solid #bbf7d0;border-radius:12px;padding:16px 20px;margin-bottom:14px}
.passage-text{font-family:'Noto Serif TC',serif;font-size:14px;line-height:2;color:#166534;white-space:pre-wrap}

/* Audio */
audio{accent-color:#7c3aed;width:100%;height:32px}

/* Scrollbar */
.un-scroll::-webkit-scrollbar{width:3px}
.un-scroll::-webkit-scrollbar-thumb{background:#e5e7eb;border-radius:2px}

/* Jump bar active */
.jump-active{color:#1a56db;border-color:#1a56db;background:#eff6ff}
</style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen" x-data="examApp()" x-init="init()">

<!-- NAVBAR -->
<nav class="sticky top-0 z-50 bg-white border-b border-gray-200 shadow-sm h-[62px] flex items-center">
  <div class="max-w-none w-full px-5 flex items-center gap-4">
    <a href="/exams.html" class="flex items-center gap-2 flex-shrink-0">
      <span class="zh text-[17px] font-bold text-navy">TOCFL <em class="text-orange not-italic">FAFA</em></span>
    </a>
    <!-- Breadcrumb -->
    <div class="flex items-center gap-1.5 text-sm text-gray-400 min-w-0 overflow-hidden">
      <a href="/exams.html" class="hover:text-blue transition flex-shrink-0">Đề thi</a>
      <i class="fa-solid fa-chevron-right text-[8px] flex-shrink-0"></i>
      <span class="text-gray-600 truncate zh" x-show="book" x-text="book?.title || '…'"></span>
      <template x-if="activeUnit && view==='exam'">
        <span class="flex items-center gap-1.5 flex-shrink-0">
          <i class="fa-solid fa-chevron-right text-[8px]"></i>
          <span class="text-gray-800 font-medium" x-text="`${activeUnit.unit_number}-${activeUnit.sub_number}`"></span>
        </span>
      </template>
    </div>
    <!-- Mobile nav toggle -->
    <button @click="navOpen=!navOpen" x-show="view==='exam'"
      class="ml-auto md:hidden flex items-center gap-1.5 text-xs font-medium text-gray-500 border border-gray-200 rounded-lg px-3 py-1.5">
      <i class="fa-solid fa-list text-[10px]"></i> Mục lục
    </button>
    <div class="ml-auto" id="nav-auth">
      <a href="/login.html" class="text-sm font-semibold text-white bg-blue hover:bg-blue-dark px-4 py-2 rounded-lg transition">Bắt đầu học</a>
    </div>
  </div>
</nav>

<!-- LOADING OVERLAY -->
<div x-show="loading" x-transition class="fixed inset-0 bg-white z-[100] flex items-center justify-center">
  <div class="text-center">
    <div class="w-10 h-10 border-4 border-blue border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
    <div class="text-sm text-gray-500">Đang tải…</div>
  </div>
</div>

<!-- MAIN LAYOUT -->
<div class="flex min-h-[calc(100vh-62px)]">

  <!-- ── LEFT NAV ────────────────────────────────── -->
  <aside :class="navOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'"
         class="fixed md:sticky top-[62px] left-0 z-40 h-[calc(100vh-62px)]
                w-72 bg-white border-r border-gray-200 flex flex-col
                un-scroll overflow-y-auto transition-transform md:transition-none">

    <!-- Book header -->
    <div class="p-4 border-b border-gray-100">
      <a href="/exams.html" class="flex items-center gap-1.5 text-xs text-gray-400 hover:text-blue mb-3 transition">
        <i class="fa-solid fa-arrow-left text-[9px]"></i> Tất cả đề thi
      </a>
      <div class="zh font-bold text-navy text-[13px] leading-snug mb-1.5" x-text="book?.title || '…'"></div>
      <div class="flex items-center gap-2 flex-wrap">
        <span x-show="book?.level" x-text="book?.level"
              class="text-[10px] font-bold text-white bg-blue px-2 py-0.5 rounded-md"></span>
        <span class="text-[11px] text-gray-400" x-text="units.length + ' sub-unit'"></span>
      </div>
    </div>

    <!-- Unit list -->
    <div class="flex-1 py-2 overflow-y-auto un-scroll">
      <template x-for="group in unitGroups" :key="group.num">
        <div>
          <div class="flex items-center gap-2 px-4 py-2 text-[10px] font-bold text-gray-400 uppercase tracking-wider">
            <i class="fa-solid fa-book text-[8px]"></i>
            Unit <span x-text="group.num"></span>
            <span class="zh font-normal normal-case tracking-normal text-gray-300 ml-1" x-text="group.titleZh"></span>
          </div>
          <template x-for="u in group.items" :key="u.id">
            <button @click="selectUnit(u)"
              :class="activeUnit?.id===u.id
                ? 'bg-blue-lt text-blue border-l-[3px] border-blue'
                : 'text-gray-700 border-l-[3px] border-transparent hover:bg-gray-50'"
              class="w-full text-left px-4 py-2.5 flex items-center gap-2.5 transition relative">
              <span class="text-[11px] font-bold min-w-[28px] tabular-nums"
                    :class="activeUnit?.id===u.id ? 'text-blue' : 'text-gray-400'"
                    x-text="`${u.unit_number}-${u.sub_number}`"></span>
              <span class="zh text-[12px] flex-1 truncate font-medium"
                    x-text="u.sub_title_zh || u.title_zh || '—'"></span>
              <!-- Result badge -->
              <template x-if="unitResults[u.id]">
                <span class="text-[10px] font-bold px-1.5 py-0.5 rounded-md flex-shrink-0"
                      :class="(unitResults[u.id].score/unitResults[u.id].total) >= 0.6
                               ? 'bg-green-lt text-green' : 'bg-orange/10 text-orange'"
                      x-text="`${unitResults[u.id].score}/${unitResults[u.id].total}`"></span>
              </template>
              <template x-if="!unitResults[u.id]">
                <span class="text-[10px] text-gray-300 flex-shrink-0">—</span>
              </template>
            </button>
          </template>
        </div>
      </template>
    </div>
  </aside>

  <!-- Backdrop for mobile nav -->
  <div x-show="navOpen" @click="navOpen=false"
       class="fixed inset-0 bg-black/30 z-30 md:hidden"></div>

  <!-- ── MAIN CONTENT ──────────────────────────── -->
  <main class="flex-1 min-w-0 overflow-x-hidden">

    <!-- ── BOOK VIEW ──────────────────── -->
    <div x-show="view==='book' && !loading">
      <!-- Book hero -->
      <div class="bg-gradient-to-br from-navy via-[#1e3a8a] to-blue py-12 px-8 relative overflow-hidden">
        <div class="absolute inset-0 pointer-events-none select-none flex items-center justify-end">
          <span class="zh text-[280px] font-bold text-white/[.04] leading-none pr-8">試</span>
        </div>
        <div class="relative z-10 max-w-3xl">
          <div class="text-[11px] font-bold uppercase tracking-widest text-white/50 mb-3">
            <i class="fa-solid fa-file-pen text-[9px] mr-1"></i>
            <span x-text="book?.level || 'TOCFL'"></span> · Bộ đề thi
          </div>
          <h1 class="zh text-3xl font-bold text-white leading-snug mb-2" x-text="book?.title || '—'"></h1>
          <p class="text-white/60 text-sm mb-6">Chọn sub-unit bên dưới để bắt đầu luyện tập</p>
          <div class="flex gap-5 flex-wrap">
            <div class="text-white/70 text-sm flex items-center gap-2">
              <span class="text-2xl font-black text-white" x-text="units.length"></span> sub-unit
            </div>
            <div class="text-white/70 text-sm flex items-center gap-2">
              <span class="text-2xl font-black text-white" x-text="Object.keys(unitResults).length"></span> đã hoàn thành
            </div>
          </div>
        </div>
      </div>

      <!-- Unit grid -->
      <div class="p-8 max-w-4xl">
        <template x-for="group in unitGroups" :key="group.num">
          <div class="mb-8">
            <div class="flex items-center gap-2 mb-4">
              <div class="w-7 h-7 rounded-lg bg-blue flex items-center justify-center">
                <span class="text-xs font-black text-white" x-text="group.num"></span>
              </div>
              <span class="font-bold text-gray-700 text-sm">Unit <span x-text="group.num"></span></span>
              <span class="zh text-gray-400 text-sm" x-text="group.titleZh"></span>
            </div>
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
              <template x-for="u in group.items" :key="u.id">
                <button @click="selectUnit(u)"
                  class="bg-white border border-gray-200 rounded-xl p-4 text-left transition hover:-translate-y-0.5 hover:shadow-md hover:border-blue group">
                  <div class="text-[11px] font-bold text-blue mb-2" x-text="`${u.unit_number}-${u.sub_number}`"></div>
                  <div class="zh text-[13px] font-semibold text-navy leading-snug mb-3"
                       x-text="u.sub_title_zh || u.title_zh || '—'"></div>
                  <template x-if="unitResults[u.id]">
                    <div class="flex items-center gap-1.5">
                      <div class="flex-1 h-1.5 bg-gray-100 rounded-full overflow-hidden">
                        <div class="h-full rounded-full transition-all"
                             :class="(unitResults[u.id].score/unitResults[u.id].total)>=0.6 ? 'bg-green' : 'bg-orange'"
                             :style="`width:${Math.round(unitResults[u.id].score/unitResults[u.id].total*100)}%`"></div>
                      </div>
                      <span class="text-[11px] font-bold"
                            :class="(unitResults[u.id].score/unitResults[u.id].total)>=0.6 ? 'text-green' : 'text-orange'"
                            x-text="`${unitResults[u.id].score}/${unitResults[u.id].total}`"></span>
                    </div>
                  </template>
                  <template x-if="!unitResults[u.id]">
                    <div class="flex items-center gap-1 text-[11px] text-gray-400">
                      <i class="fa-solid fa-play text-[9px] text-blue"></i> Bắt đầu
                    </div>
                  </template>
                </button>
              </template>
            </div>
          </div>
        </template>
      </div>
    </div>

    <!-- ── EXAM VIEW ───────────────────── -->
    <div x-show="view==='exam' && !loading">

      <!-- Section jump bar -->
      <div class="sticky top-[62px] z-30 bg-white border-b border-gray-200 shadow-sm">
        <div class="px-6 flex items-center gap-2 min-h-[48px] overflow-x-auto">
          <span class="text-[11px] font-bold text-gray-400 uppercase tracking-wider flex-shrink-0 mr-1">Phần</span>
          <template x-for="sec in sections" :key="sec.id">
            <button @click="scrollToSection(sec.id)"
              :id="`jump-${sec.id}`"
              :title="sec.title"
              class="flex-shrink-0 text-xs font-semibold px-3 py-1 rounded-full border border-gray-200 text-gray-500 hover:border-blue hover:text-blue transition zh">
              <span x-text="sectionNumZh(sec.section_number)"></span>
            </button>
          </template>
          <!-- Progress pill -->
          <div class="ml-auto flex-shrink-0 flex items-center gap-2 text-xs font-semibold text-gray-500">
            <span :class="allAnswered ? 'text-green' : 'text-blue'"
                  x-text="`${answeredQ}/${totalQ} câu`"></span>
          </div>
        </div>
      </div>

      <div class="max-w-3xl mx-auto px-4 md:px-8 py-6 pb-32">

        <!-- Unit header -->
        <div class="bg-gradient-to-br from-navy via-[#1e3a8a] to-blue rounded-2xl p-6 mb-6 relative overflow-hidden">
          <div class="absolute bottom-0 right-0 pointer-events-none select-none">
            <span class="zh text-[180px] font-bold text-white/[.05] leading-none">學</span>
          </div>
          <div class="relative z-10 flex items-start justify-between gap-4">
            <div>
              <div class="text-[11px] font-bold uppercase tracking-widest text-white/50 mb-2">
                Unit <span x-text="activeUnit && `${activeUnit.unit_number}-${activeUnit.sub_number}`"></span>
                · <span class="zh" x-text="activeUnit?.title_zh || ''"></span>
              </div>
              <h2 class="zh text-2xl font-bold text-white leading-snug"
                  x-text="activeUnit?.sub_title_zh || activeUnit?.title_zh || '—'"></h2>
            </div>
            <div class="text-right flex-shrink-0">
              <div class="text-3xl font-black text-white leading-none"
                   x-text="submitted ? `${examScore}/${totalQ}` : `${answeredQ}/${totalQ}`"></div>
              <div class="text-[11px] text-white/50 mt-1" x-text="submitted ? 'điểm' : 'đã trả lời'"></div>
            </div>
          </div>
          <!-- Progress bar -->
          <div class="mt-4 relative z-10">
            <div class="h-1.5 bg-white/10 rounded-full overflow-hidden">
              <div class="h-full rounded-full transition-all duration-300"
                   :class="submitted ? 'bg-green' : 'bg-white/40'"
                   :style="`width:${totalQ ? Math.round((submitted ? examScore : answeredQ)/totalQ*100) : 0}%`"></div>
            </div>
          </div>
        </div>

        <!-- Result banner -->
        <div x-show="submitted" x-transition
             :class="(examScore/totalQ) >= 0.6
               ? 'bg-green-lt border-green/30'
               : 'bg-[#fff7ed] border-orange/30'"
             class="rounded-2xl border p-5 mb-6 flex items-center gap-4">
          <div class="text-4xl" x-text="(examScore/totalQ)>=0.6 ? '🎉' : '📚'"></div>
          <div class="flex-1">
            <div class="font-bold text-gray-800 text-base"
                 x-text="(examScore/totalQ)>=0.6 ? 'Xuất sắc! Bạn đã vượt qua!' : 'Hãy luyện tập thêm nhé!'"></div>
            <div class="text-sm text-gray-500 mt-0.5"
                 x-text="`Đúng ${examScore}/${totalQ} câu — ${Math.round(examScore/totalQ*100)}% chính xác`"></div>
          </div>
          <div class="flex flex-col gap-2 flex-shrink-0">
            <button @click="retry()" class="flex items-center gap-2 bg-blue text-white text-xs font-bold px-4 py-2 rounded-lg hover:bg-blue-dark transition">
              <i class="fa-solid fa-rotate-right text-[10px]"></i> Làm lại
            </button>
            <button x-show="nextUnitItem" @click="goNext()"
              class="flex items-center gap-2 bg-green text-white text-xs font-bold px-4 py-2 rounded-lg hover:bg-green/90 transition">
              Tiếp theo <i class="fa-solid fa-arrow-right text-[10px]"></i>
            </button>
          </div>
        </div>

        <!-- Sections -->
        <template x-for="sec in sections" :key="sec.id">
          <div :id="`sec-${sec.id}`" class="bg-white rounded-2xl border border-gray-200 mb-5 overflow-hidden">

            <!-- Section header -->
            <div class="flex items-center gap-3 px-5 py-4 border-b border-gray-100"
                 :class="{
                   'bg-purple-lt/50': sec.section_type==='listening',
                   'bg-blue-lt/40':   sec.section_type==='completion',
                   'bg-[#fff7ed]/60': sec.section_type==='cloze',
                   'bg-green-lt/40':  sec.section_type==='reading' || sec.section_type==='essay',
                 }">
              <div class="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0"
                   :class="{
                     'bg-purple text-white':  sec.section_type==='listening',
                     'bg-blue text-white':    sec.section_type==='completion',
                     'bg-orange text-white':  sec.section_type==='cloze',
                     'bg-green text-white':   sec.section_type==='reading'||sec.section_type==='essay',
                     'bg-blue text-white':    sec.section_type==='mcq',
                   }">
                <i :class="{
                     'fa-headphones':  sec.section_type==='listening',
                     'fa-pen-nib':     sec.section_type==='completion',
                     'fa-fill-drip':   sec.section_type==='cloze',
                     'fa-book-open':   sec.section_type==='reading'||sec.section_type==='essay',
                     'fa-list-ul':     sec.section_type==='mcq',
                   }" class="fa-solid text-sm"></i>
              </div>
              <div class="zh font-bold text-gray-800 flex-1 text-[14px]" x-text="sec.title || sec.section_type"></div>
              <span class="text-[11px] font-medium text-gray-400 bg-gray-100 px-2.5 py-0.5 rounded-full"
                    x-text="(questionsBySection[sec.id]||[]).length + ' câu'"></span>
            </div>

            <div class="p-5">

              <!-- Audio block (listening) -->
              <template x-if="sec.section_type==='listening'">
                <div>
                  <template x-if="sec.audio_url">
                    <div class="flex items-center gap-4 bg-gradient-to-r from-purple-lt to-purple/5 border border-purple/20 rounded-xl p-4 mb-5">
                      <div class="w-10 h-10 rounded-xl bg-purple flex items-center justify-center flex-shrink-0">
                        <i class="fa-solid fa-headphones text-white text-base"></i>
                      </div>
                      <div class="flex-1 min-w-0">
                        <div class="text-xs font-bold text-purple mb-2">🔊 Đoạn hội thoại — Nghe và trả lời</div>
                        <audio controls :src="sec.audio_url" preload="metadata" class="w-full"></audio>
                      </div>
                    </div>
                  </template>
                  <template x-if="!sec.audio_url">
                    <div class="flex items-center gap-3 bg-gray-50 border border-dashed border-gray-200 rounded-xl p-4 mb-5">
                      <i class="fa-solid fa-headphones text-gray-300 text-xl"></i>
                      <span class="text-sm text-gray-400 italic">Audio chưa có — sẽ được cập nhật sớm</span>
                    </div>
                  </template>
                </div>
              </template>

              <!-- Passages + questions interleaved -->
              <template x-if="(passagesBySection[sec.id]||[]).length > 0">
                <div>
                  <template x-for="p in passagesBySection[sec.id]" :key="p.id">
                    <div>
                      <div class="passage-block">
                        <template x-if="p.label">
                          <div class="text-[11px] font-extrabold text-green uppercase tracking-wider flex items-center gap-1.5 mb-2">
                            <i class="fa-solid fa-paragraph text-[9px]"></i>
                            <span x-text="p.label"></span>
                          </div>
                        </template>
                        <div class="passage-text" x-text="p.content_text || ''"></div>
                      </div>
                      <!-- Questions for this passage -->
                      <template x-for="q in questionsFor(sec.id, p.id)" :key="q.id">
                        <div x-html="renderQuestion(q)" class="mb-4"></div>
                      </template>
                    </div>
                  </template>
                  <!-- Questions not linked to any passage -->
                  <template x-for="q in questionsFor(sec.id, null)" :key="q.id">
                    <div x-html="renderQuestion(q)" class="mb-4"></div>
                  </template>
                </div>
              </template>

              <!-- Sections with no passages -->
              <template x-if="!(passagesBySection[sec.id]||[]).length">
                <div>
                  <template x-for="q in (questionsBySection[sec.id]||[])" :key="q.id">
                    <div x-html="renderQuestion(q)" class="mb-4"></div>
                  </template>
                </div>
              </template>

            </div>
          </div>
        </template>

        <!-- Section B: vocab + phrases -->
        <template x-if="vocab.length || phrases.length">
          <div class="bg-white rounded-2xl border border-gray-200 overflow-hidden mb-5">
            <button @click="secBOpen=!secBOpen"
              class="w-full flex items-center gap-3 px-5 py-4 hover:bg-gray-50 transition">
              <div class="w-9 h-9 rounded-xl bg-yellow-50 flex items-center justify-center flex-shrink-0">
                <i class="fa-solid fa-book-bookmark text-yellow-600 text-sm"></i>
              </div>
              <span class="zh font-bold text-gray-800 text-[14px] flex-1 text-left">B · 關鍵詞語 — Từ vựng &amp; Cụm từ</span>
              <i :class="secBOpen ? 'fa-chevron-up' : 'fa-chevron-down'"
                 class="fa-solid text-gray-400 text-[11px]"></i>
            </button>
            <div x-show="secBOpen" x-collapse class="px-5 pb-5">
              <!-- Vocab -->
              <template x-if="vocab.length">
                <div class="mb-5">
                  <div class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-book text-[10px]"></i> 一、主題相關詞語
                  </div>
                  <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                      <thead><tr class="bg-gray-50">
                        <th class="text-left text-[11px] font-bold text-gray-400 uppercase px-3 py-2 border-b border-gray-100">Xuất xứ</th>
                        <th class="text-left text-[11px] font-bold text-gray-400 uppercase px-3 py-2 border-b border-gray-100">Từ</th>
                        <th class="text-left text-[11px] font-bold text-gray-400 uppercase px-3 py-2 border-b border-gray-100">Từ liên quan</th>
                      </tr></thead>
                      <tbody>
                        <template x-for="v in vocab" :key="v.id">
                          <tr class="border-b border-gray-50">
                            <td class="px-3 py-2 text-[11px] text-gray-400" x-text="v.source_section||''"></td>
                            <td class="px-3 py-2 zh font-semibold text-[14px]" x-text="v.word_zh||''"></td>
                            <td class="px-3 py-2 text-xs text-gray-500" x-text="v.related_words||''"></td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </div>
              </template>
              <!-- Phrases -->
              <template x-if="phrases.length">
                <div>
                  <div class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-pen-nib text-[10px]"></i> 二、常用詞組
                  </div>
                  <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                      <thead><tr class="bg-gray-50">
                        <th class="text-left text-[11px] font-bold text-gray-400 uppercase px-3 py-2 border-b border-gray-100">Xuất xứ</th>
                        <th class="text-left text-[11px] font-bold text-gray-400 uppercase px-3 py-2 border-b border-gray-100">Cụm từ</th>
                        <th class="text-left text-[11px] font-bold text-gray-400 uppercase px-3 py-2 border-b border-gray-100">Ví dụ</th>
                      </tr></thead>
                      <tbody>
                        <template x-for="p in phrases" :key="p.id">
                          <tr class="border-b border-gray-50">
                            <td class="px-3 py-2 text-[11px] text-gray-400" x-text="p.source_section||''"></td>
                            <td class="px-3 py-2 zh text-[14px]" x-text="p.phrase_zh||''"></td>
                            <td class="px-3 py-2 text-xs text-gray-500 zh" x-text="p.example_zh||''"></td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </template>

      </div>

      <!-- Sticky submit bar -->
      <div x-show="!submitted"
           class="fixed bottom-0 left-0 right-0 z-30 bg-white/90 backdrop-blur border-t border-gray-200 px-6 py-3 flex items-center justify-between gap-4">
        <div class="flex items-center gap-2 text-sm">
          <div class="h-2 w-32 bg-gray-100 rounded-full overflow-hidden">
            <div class="h-full bg-blue rounded-full transition-all"
                 :style="`width:${totalQ ? Math.round(answeredQ/totalQ*100) : 0}%`"></div>
          </div>
          <span class="text-gray-500 text-xs" x-text="`${answeredQ}/${totalQ} câu đã trả lời`"></span>
        </div>
        <button @click="submitExam()"
          :disabled="!allAnswered"
          :class="allAnswered
            ? 'bg-blue hover:bg-blue-dark shadow-lg shadow-blue/30 cursor-pointer'
            : 'bg-gray-200 text-gray-400 cursor-not-allowed'"
          class="flex items-center gap-2 text-white text-sm font-bold px-6 py-2.5 rounded-xl transition">
          <i class="fa-solid fa-check-double text-xs"></i>
          Kiểm tra đáp án
        </button>
      </div>

    </div>
    <!-- end exam view -->

  </main>
</div>

<script>
const _DB_URL = 'https://prctmferugkxabyizslx.supabase.co';
const _DB_KEY = 'sb_publishable_6-_0uUkFDKDCA4HBNdB0Gg_ZEL_GqJQ';
const _db   = supabase.createClient(_DB_URL, _DB_KEY);
const _auth = typeof AuthService !== 'undefined' ? new AuthService(_db) : null;
let _user   = null;

function esc(t){ return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

const ZH_NUMS = {1:'一',2:'二',3:'三',4:'四',5:'五'};

function examApp() {
  return {
    // ── State ──────────────────────────────────────────
    loading:  true,
    navOpen:  false,
    view:     'book',   // 'book' | 'exam'
    book:     null,
    units:    [],
    unitResults: {},     // unit_id → {score, total}

    // Exam state
    activeUnit:       null,
    sections:         [],
    passagesBySection:{},  // secId → [passage]
    questionsBySection:{}, // secId → [question]
    choicesForQ:      {},  // qId → {A,B,C,D}
    vocab:   [],
    phrases: [],
    answers: {},     // qId → label
    submitted: false,
    secBOpen:  false,
    activeSectionId: null,

    // ── Computed ───────────────────────────────────────
    get totalQ()     { return Object.values(this.questionsBySection).flat().length },
    get answeredQ()  { return Object.keys(this.answers).length },
    get allAnswered() { return this.answeredQ === this.totalQ && this.totalQ > 0 },
    get examScore() {
      if (!this.submitted) return 0;
      return Object.values(this.questionsBySection).flat()
        .filter(q => this.answers[q.id] === q.correct_answer).length;
    },
    get unitGroups() {
      const groups = {};
      this.units.forEach(u => {
        if (!groups[u.unit_number]) groups[u.unit_number] = { num: u.unit_number, titleZh: u.title_zh, items: [] };
        groups[u.unit_number].items.push(u);
      });
      return Object.values(groups);
    },
    get nextUnitItem() {
      if (!this.activeUnit) return null;
      const flat = this.units;
      const idx  = flat.findIndex(u => u.id === this.activeUnit.id);
      return idx >= 0 && idx + 1 < flat.length ? flat[idx + 1] : null;
    },

    // ── Init ───────────────────────────────────────────
    async init() {
      if (_auth) {
        _auth.init().then(u => {
          _user = u;
          renderNavAuth(u);
          if (u) this.loadAllResults(u.id);
        });
      }

      const params = new URLSearchParams(location.search);
      const bookId  = params.get('book');
      const unitNum = params.get('unit');
      const subNum  = params.get('sub');

      if (!bookId) { location.href = '/exams.html'; return; }

      const [{ data: book }, { data: units }] = await Promise.all([
        _db.from('exam_books').select('*').eq('id', bookId).single(),
        _db.from('exam_units').select('id,book_id,unit_number,sub_number,title_zh,sub_title_zh,status')
           .eq('book_id', bookId).eq('status','published').order('unit_number').order('sub_number'),
      ]);

      this.book  = book;
      this.units = units || [];

      document.title = `${book?.title || 'Đề thi'} — TOCFL FAFA`;

      this.loading = false;

      if (unitNum && subNum) {
        const unit = this.units.find(u => u.unit_number===+unitNum && u.sub_number===+subNum);
        if (unit) { await this.loadUnit(unit); return; }
      }
      this.view = 'book';
    },

    async loadAllResults(userId) {
      const { data } = await _db.from('exam_results')
        .select('unit_id,score,total').eq('user_id', userId);
      const map = {};
      (data||[]).forEach(r => { map[r.unit_id] = { score: r.score, total: r.total }; });
      this.unitResults = map;
    },

    // ── Select unit ────────────────────────────────────
    async selectUnit(unit) {
      this.navOpen = false;
      const p = new URLSearchParams(location.search);
      p.set('unit', unit.unit_number); p.set('sub', unit.sub_number);
      history.pushState({}, '', '?' + p.toString());
      await this.loadUnit(unit);
    },

    async loadUnit(unit) {
      this.loading = true;
      this.activeUnit = unit;
      this.sections = []; this.passagesBySection = {}; this.questionsBySection = {};
      this.choicesForQ = {}; this.vocab = []; this.phrases = [];
      this.answers = {}; this.submitted = false; this.secBOpen = false;

      const { data: sections } = await _db.from('exam_sections')
        .select('id,section_number,section_type,title,audio_url')
        .eq('unit_id', unit.id).order('section_number');
      this.sections = sections || [];

      const secIds = this.sections.map(s => s.id);
      if (!secIds.length) { this.loading = false; this.view = 'exam'; return; }

      // Parallel queries
      const [{ data: passArr }, { data: qArr }, { data: vocabArr }, { data: phrasesArr }] = await Promise.all([
        _db.from('exam_passages').select('id,section_id,label,content_text').in('section_id', secIds).order('id'),
        _db.from('exam_questions')
           .select('id,section_id,passage_id,question_number,question_text,correct_answer')
           .in('section_id', secIds).order('question_number'),
        _db.from('exam_vocab').select('*').eq('unit_id', unit.id),
        _db.from('exam_phrases').select('*').eq('unit_id', unit.id),
      ]);

      // Fetch choices separately once we have question IDs
      const qIds = (qArr||[]).map(q=>q.id);
      const { data: choicesArr } = qIds.length
        ? await _db.from('exam_choices').select('question_id,label,text').in('question_id',qIds).order('label')
        : { data: [] };

      // Index passages
      const pByS = {};
      (passArr||[]).forEach(p => { if(!pByS[p.section_id]) pByS[p.section_id]=[]; pByS[p.section_id].push(p); });
      this.passagesBySection = pByS;

      // Index choices
      const cByQ = {};
      (choicesArr||[]).forEach(c => { if(!cByQ[c.question_id]) cByQ[c.question_id]={}; cByQ[c.question_id][c.label]=c.text; });
      this.choicesForQ = cByQ;

      // Index questions
      const qByS = {};
      (qArr||[]).forEach(q => { if(!qByS[q.section_id]) qByS[q.section_id]=[]; qByS[q.section_id].push(q); });
      this.questionsBySection = qByS;

      this.vocab   = vocabArr   || [];
      this.phrases = phrasesArr || [];
      this.loading = false;
      this.view = 'exam';

      this.$nextTick(() => { this.setupObserver(); window.scrollTo(0,0); });
    },

    // ── Question helpers ───────────────────────────────
    questionsFor(secId, passId) {
      const qs = this.questionsBySection[secId] || [];
      return qs.filter(q => String(q.passage_id ?? '__none__') === String(passId ?? '__none__'));
    },

    renderQuestion(q) {
      const choices = this.choicesForQ[q.id] || {};
      const ans     = this.answers[q.id];
      const corr    = q.correct_answer;
      const sub     = this.submitted;
      const ABCD    = ['A','B','C','D'];

      const choiceHtml = ABCD.map(l => {
        const text = choices[l] || '';
        let cls = 'choice-btn w-full flex items-start gap-2.5 p-3 border-[1.5px] border-gray-200 rounded-xl text-sm bg-white';
        if (!sub && ans === l)                    cls += ' selected';
        if (sub && l === corr && l === ans)       cls += ' c-correct';
        if (sub && l !== corr && l === ans)       cls += ' c-wrong';
        if (sub && l === corr && l !== ans)       cls += ' c-miss';
        const disabled = sub ? 'disabled' : '';
        return `<button class="${cls}" onclick="window._app.pick(${q.id},'${l}')" ${disabled}>
          <span class="lbl text-xs font-black min-w-[14px] mt-0.5 flex-shrink-0">${l}</span>
          <span class="zh text-[13px] leading-relaxed">${esc(text)}</span>
        </button>`;
      }).join('');

      const resultHtml = sub ? (() => {
        const ok = ans === corr;
        return `<div class="text-[11px] font-bold mt-2 ${ok ? 'text-green' : 'text-red-500'}">
          ${ok ? '<i class="fa-solid fa-check mr-1"></i>Chính xác!' : `<i class="fa-solid fa-xmark mr-1"></i>Sai — Đáp án đúng: <strong>${esc(corr||'?')}</strong>`}
        </div>`;
      })() : '';

      return `<div class="mb-4" id="q-${q.id}">
        <div class="flex items-start gap-2.5 mb-2.5">
          <span class="text-sm font-extrabold text-blue min-w-[26px] pt-0.5 flex-shrink-0">${q.question_number}.</span>
          <span class="zh text-sm leading-relaxed text-gray-800">${esc(q.question_text||'')}</span>
        </div>
        <div class="grid grid-cols-2 gap-2">${choiceHtml}</div>
        ${resultHtml}
      </div>`;
    },

    // ── Interaction ────────────────────────────────────
    pick(qId, label) {
      if (this.submitted) return;
      this.answers = { ...this.answers, [qId]: label };
    },

    async submitExam() {
      if (!this.allAnswered || this.submitted) return;
      this.submitted = true;

      // Save to DB if logged in
      if (_user && this.activeUnit) {
        const score = this.examScore;
        await _db.from('exam_results').upsert({
          user_id: _user.id,
          unit_id: this.activeUnit.id,
          answers: this.answers,
          score,
          total: this.totalQ,
        }, { onConflict: 'user_id,unit_id' });
        this.unitResults = { ...this.unitResults, [this.activeUnit.id]: { score, total: this.totalQ } };
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });
    },

    retry() {
      this.answers = {}; this.submitted = false;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    },

    async goNext() {
      const next = this.nextUnitItem;
      if (next) await this.selectUnit(next);
    },

    // ── Section jump + observer ────────────────────────
    sectionNumZh(n) { return ZH_NUMS[n] || String(n); },

    scrollToSection(secId) {
      const el = document.getElementById(`sec-${secId}`);
      if (el) el.scrollIntoView({ behavior:'smooth', block:'start' });
    },

    setupObserver() {
      if (this._observer) this._observer.disconnect();
      const io = new IntersectionObserver(entries => {
        entries.forEach(e => {
          const btn = document.getElementById(`jump-${e.target.id.replace('sec-','')}`);
          if (!btn) return;
          if (e.isIntersecting) {
            document.querySelectorAll('[id^="jump-"]').forEach(b => b.classList.remove('jump-active'));
            btn.classList.add('jump-active');
          }
        });
      }, { rootMargin: '-62px 0px -60% 0px', threshold: 0 });
      this.sections.forEach(s => {
        const el = document.getElementById(`sec-${s.id}`);
        if (el) io.observe(el);
      });
      this._observer = io;
    },
  };
}

// Expose pick() globally for inline onclick in renderQuestion
document.addEventListener('alpine:init', () => {
  window._app = document.querySelector('[x-data]')._x_dataStack?.[0];
});
document.addEventListener('alpine:initialized', () => {
  window._app = Alpine.$data(document.querySelector('[x-data]'));
});

function renderNavAuth(user) {
  const wrap = document.getElementById('nav-auth');
  if (!user) { wrap.innerHTML = `<a href="/login.html" class="text-sm font-semibold text-white bg-[#1a56db] hover:bg-[#1544b8] px-4 py-2 rounded-lg transition">Bắt đầu học</a>`; return; }
  const init = user.email?.[0]?.toUpperCase()||'U';
  wrap.innerHTML = `<a href="/dashboard.html" class="w-8 h-8 rounded-full bg-gradient-to-br from-[#7c3aed] to-[#a855f7] flex items-center justify-center text-sm font-bold text-white" title="Dashboard">${init}</a>`;
}
</script>
</body>
</html>
