<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>整修中 · Đang bảo trì</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #35858E, #7DA78C 35%, #C2D099 70%, #E6EEC9);
  background-size: 400% 400%;
  animation: bgShift 18s ease infinite;
  display: flex; align-items: center; justify-content: center;
  color: #fff; text-align: center;
  padding: 1.5rem;
  overflow: hidden;
}
@keyframes bgShift {
  0%   { background-position:   0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position:   0% 50%; }
}

/* Floating circles in background */
body::before, body::after {
  content: '';
  position: fixed;
  border-radius: 50%;
  background: rgba(255,255,255,.1);
  filter: blur(40px);
  pointer-events: none;
}
body::before { width: 300px; height: 300px; top: -100px; left: -100px; animation: float1 12s ease-in-out infinite; }
body::after  { width: 250px; height: 250px; bottom: -80px; right: -80px; animation: float2 14s ease-in-out infinite; }
@keyframes float1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(60px,40px)} }
@keyframes float2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-50px,-30px)} }

.card {
  position: relative; z-index: 1;
  background: rgba(255,255,255,.16);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,.28);
  border-radius: 28px;
  padding: 56px 48px;
  max-width: 520px;
  width: 100%;
  box-shadow: 0 24px 60px rgba(0,0,0,.18);
}

.icon {
  font-size: 64px;
  margin-bottom: 18px;
  display: inline-block;
  animation: spin 8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

h1 {
  font-size: clamp(28px, 5.5vw, 48px);
  font-weight: 800;
  line-height: 1.15;
  letter-spacing: -.5px;
  margin-bottom: 12px;
}

.zh {
  font-family: 'Noto Serif TC', 'Microsoft JhengHei', serif;
  font-size: clamp(20px, 4vw, 32px);
  font-weight: 600;
  letter-spacing: 6px;
  margin-bottom: 28px;
  opacity: .96;
}

.msg {
  font-size: clamp(14px, 2.2vw, 17px);
  opacity: .88;
  margin-bottom: 36px;
  line-height: 1.7;
}

.lucas {
  display: inline-block;
  background: #fff;
  color: #2a6e76;
  padding: 14px 32px;
  border-radius: 50px;
  font-weight: 800;
  font-size: clamp(15px, 2.5vw, 19px);
  letter-spacing: .3px;
  box-shadow: 0 10px 28px rgba(0,0,0,.15);
  transform: rotate(-3deg);
  animation: wiggle 3.2s ease-in-out infinite;
}
@keyframes wiggle {
  0%, 100% { transform: rotate(-3deg) scale(1); }
  50%      { transform: rotate(3deg) scale(1.05); }
}

footer {
  position: fixed; bottom: 18px; left: 0; right: 0;
  text-align: center;
  font-size: 11px;
  color: rgba(255,255,255,.55);
  letter-spacing: 1px;
  text-transform: uppercase;
}
</style>
</head>
<body>

<div class="card">
  <div class="icon">🚧</div>
  <h1>Đang bảo trì</h1>
  <div class="zh">整修中</div>
  <p class="msg">
    Hệ thống tạm dừng hoạt động.<br>
    Vui lòng quay lại sau.
  </p>
  <span class="lucas">✨ Lucas đẹp trai !! ✨</span>
</div>

<footer>© 2026</footer>

</body>
</html>
