<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>整修中 · Đang bảo trì</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #35858E, #7DA78C 35%, #C2D099 70%, #E6EEC9);
  background-size: 400% 400%;
  animation: bgShift 18s ease infinite;
  display: flex; align-items: center; justify-content: center;
  color: #fff; text-align: center;
  padding: 1.5rem;
  overflow: hidden;
}
@keyframes bgShift {
  0%   { background-position:   0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position:   0% 50%; }
}

/* Floating circles in background */
body::before, body::after {
  content: '';
  position: fixed;
  border-radius: 50%;
  background: rgba(255,255,255,.1);
  filter: blur(40px);
  pointer-events: none;
}
body::before { width: 300px; height: 300px; top: -100px; left: -100px; animation: float1 12s ease-in-out infinite; }
body::after  { width: 250px; height: 250px; bottom: -80px; right: -80px; animation: float2 14s ease-in-out infinite; }
@keyframes float1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(60px,40px)} }
@keyframes float2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-50px,-30px)} }

.card {
  position: relative; z-index: 1;
  background: rgba(255,255,255,.16);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,.28);
  border-radius: 28px;
  padding: 56px 48px;
  max-width: 520px;
  width: 100%;
  box-shadow: 0 24px 60px rgba(0,0,0,.18);
}

.icon {
  font-size: 64px;
  margin-bottom: 18px;
  display: inline-block;
  animation: spin 8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

h1 {
  font-size: clamp(28px, 5.5vw, 48px);
  font-weight: 800;
  line-height: 1.15;
  letter-spacing: -.5px;
  margin-bottom: 12px;
}

.zh {
  font-family: 'Noto Serif TC', 'Microsoft JhengHei', serif;
  font-size: clamp(20px, 4vw, 32px);
  font-weight: 600;
  letter-spacing: 6px;
  margin-bottom: 28px;
  opacity: .96;
}

.msg {
  font-size: clamp(14px, 2.2vw, 17px);
  opacity: .88;
  margin-bottom: 36px;
  line-height: 1.7;
}

.lucas {
  display: inline-block;
  background: #fff;
  color: #2a6e76;
  padding: 14px 32px;
  border-radius: 50px;
  font-weight: 800;
  font-size: clamp(15px, 2.5vw, 19px);
  letter-spacing: .3px;
  box-shadow: 0 10px 28px rgba(0,0,0,.15);
  transform: rotate(-3deg);
  animation: wiggle 3.2s ease-in-out infinite;
  margin-bottom: 28px;
}
@keyframes wiggle {
  0%, 100% { transform: rotate(-3deg) scale(1); }
  50%      { transform: rotate(3deg) scale(1.05); }
}

/* Hidden YouTube iframe — audio only via YT IFrame API */
#yt-player {
  position: fixed;
  top: -9999px; left: -9999px;
  width: 1px; height: 1px;
  visibility: hidden;
  pointer-events: none;
}

/* Floating music control chip */
.music-chip {
  position: fixed;
  top: 24px; right: 24px;
  background: rgba(255,255,255,.2);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid rgba(255,255,255,.3);
  color: #fff;
  padding: 10px 18px 10px 14px;
  border-radius: 50px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  z-index: 100;
  transition: transform .2s, background .2s;
  font-family: inherit;
  letter-spacing: .2px;
  user-select: none;
}
.music-chip:hover {
  transform: scale(1.05);
  background: rgba(255,255,255,.28);
}
.music-chip .ic {
  font-size: 16px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px; height: 22px;
}
.music-chip.playing .ic { animation: spin 4s linear infinite; }
@media (max-width: 480px) {
  .music-chip {
    top: 14px; right: 14px;
    padding: 8px 14px 8px 10px;
    font-size: 12px;
  }
}

footer {
  position: fixed; bottom: 18px; left: 0; right: 0;
  text-align: center;
  font-size: 11px;
  color: rgba(255,255,255,.55);
  letter-spacing: 1px;
  text-transform: uppercase;
}
</style>
</head>
<body>

<div class="card">
  <div class="icon">🚧</div>
  <h1>Đang bảo trì</h1>
  <div class="zh">整修中</div>
  <p class="msg">
    Hệ thống tạm dừng hoạt động.<br>
    Vui lòng quay lại sau.
  </p>
  <span class="lucas">✨ Lucas đẹp trai !! ✨</span>
</div>

<!-- Hidden YouTube player (audio only) -->
<div id="yt-player"></div>

<!-- Floating music control -->
<button class="music-chip" id="music-chip" type="button">
  <span class="ic" id="music-ic">🎵</span>
  <span id="music-tx">Bật nhạc</span>
</button>

<footer>© 2026</footer>

<script>
let player, isPlaying = false;
const chip = document.getElementById('music-chip');
const ic   = document.getElementById('music-ic');
const tx   = document.getElementById('music-tx');

function setUi(playing) {
  isPlaying = playing;
  chip.classList.toggle('playing', playing);
  ic.textContent = playing ? '🎶' : '🎵';
  tx.textContent = playing ? 'Đang phát' : 'Bật nhạc';
}

chip.addEventListener('click', () => {
  if (!player) return;
  if (isPlaying) player.pauseVideo();
  else { try { player.unMute(); } catch(_){} player.playVideo(); }
});

// Load YouTube IFrame API
const tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(tag);

window.onYouTubeIframeAPIReady = function () {
  player = new YT.Player('yt-player', {
    height: '0', width: '0',
    videoId: 'Ms5DcAtTou8',
    playerVars: {
      autoplay: 1,
      controls: 0,
      loop: 1,
      playlist: 'Ms5DcAtTou8',  // required for loop=1 to work
      modestbranding: 1,
      rel: 0,
      playsinline: 1,
    },
    events: {
      onReady: (e) => {
        try { e.target.setVolume(55); } catch(_) {}
        // Most browsers block unmuted autoplay on first visit.
        // Try anyway; if blocked, user clicks the chip.
        try { e.target.playVideo(); } catch(_) {}
      },
      onStateChange: (e) => {
        // 1 = playing, 2 = paused, 0 = ended (loop will restart)
        if (e.data === 1) setUi(true);
        else if (e.data === 2) setUi(false);
      },
    },
  });
};
</script>

</body>
</html>
