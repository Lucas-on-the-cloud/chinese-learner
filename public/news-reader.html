<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đọc bài — TOCFL FAFA</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7/dist/hanzi-writer.min.js"></script>
<script src="js/auth-service.js"></script>
<link rel="stylesheet" href="/css/comments.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Be Vietnam Pro',sans-serif;color:#1f2937;background:#f4f5f7;display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
:root{--blue:#1a56db;--blue-dark:#1544b8;--blue-lt:#eff6ff;--navy:#0d1b4b;--orange:#f47b20;--green:#16a34a;--green-lt:#f0fdf4;--red:#dc2626;--red-lt:#fef2f2;--text:#1f2937;--text-2:#6b7280;--text-3:#9ca3af;--border:#e5e7eb;--surface:#fff;--bg:#f4f5f7;--success:#16a34a;--success-lt:#f0fdf4;--danger:#dc2626;--danger-lt:#fef2f2}

.navbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--border);height:62px;display:flex;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.navbar .container{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:1100px;margin:0 auto;padding:0 1.5rem}
.nav-brand{display:flex;align-items:center;gap:10px}
.nav-brand img{height:32px;border-radius:5px}
.nav-brand-text{font-family:'Noto Serif TC',serif;font-size:18px;font-weight:700;color:var(--navy)}
.nav-brand-text em{color:var(--orange);font-style:normal}
.nav-menu{display:flex;align-items:center;gap:2px}
.nav-link{font-size:14px;font-weight:500;color:var(--text-2);padding:6px 12px;border-radius:6px;transition:.15s;white-space:nowrap}
.nav-link:hover{color:var(--text);background:var(--bg)}
.nav-link.active{color:var(--blue);font-weight:600}
.nav-auth{display:flex;align-items:center;gap:8px;margin-left:8px}
.nav-btn{font-size:13px;font-weight:600;color:#fff;background:var(--blue);padding:7px 18px;border-radius:7px;transition:.15s;white-space:nowrap}
.nav-btn:hover{background:var(--blue-dark)}

.page{flex:1;max-width:1100px;width:100%;margin:0 auto;padding:24px 1.5rem 60px}
.back-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2);margin-bottom:18px;padding:6px 12px;border-radius:7px;transition:.15s}
.back-btn:hover{background:var(--surface);color:var(--text)}

.article-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-3);margin-bottom:10px;flex-wrap:wrap}
.article-source{color:var(--blue);font-weight:600}
.article-cat-badge{background:var(--blue-lt);color:var(--blue);padding:2px 9px;border-radius:5px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.article-title{font-family:'Noto Serif TC',serif;font-size:clamp(22px,3vw,30px);font-weight:700;color:var(--navy);line-height:1.35;margin-bottom:8px}
.article-title-vi{font-size:15px;color:var(--text-2);line-height:1.5;font-style:italic;margin-bottom:18px}
.article-source-link{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--blue);background:var(--blue-lt);padding:6px 12px;border-radius:7px;margin-bottom:20px;border:1px solid #c7d7fd}

/* Tabs */
.tabs{display:flex;gap:4px;margin-bottom:18px;background:#fff;border:1px solid var(--border);border-radius:9px;padding:4px}
.tab{flex:1;padding:9px 8px;border-radius:6px;border:none;background:transparent;color:var(--text-2);font-family:'Be Vietnam Pro',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.tab:hover{color:var(--text)}
.tab.active{background:var(--navy);color:#fff}

/* Content card */
.content-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:28px 32px;line-height:1.85}
.para{margin-bottom:20px;padding-bottom:18px;border-bottom:1px dashed #e5e7eb}
.para:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none}
.para-zh{font-family:'Noto Serif TC',serif;font-size:18.5px;font-weight:500;color:var(--navy);line-height:1.9;letter-spacing:.4px;text-align:justify}
.para-pinyin{font-family:'Be Vietnam Pro',sans-serif;font-size:14.5px;color:var(--text-2);line-height:1.85;letter-spacing:.02em;text-align:justify}
.para-vi{font-size:15px;color:var(--text);line-height:1.85;text-align:justify}
.parallel{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:18px;margin-bottom:18px;padding-bottom:18px;border-bottom:1px dashed #e5e7eb}
.parallel:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none}
.parallel-zh{font-family:'Noto Serif TC',serif;font-size:17px;font-weight:500;color:var(--navy);line-height:1.85;letter-spacing:.4px;text-align:justify}
.parallel-py{font-family:'Be Vietnam Pro',sans-serif;font-size:13px;color:var(--text-2);line-height:1.75;letter-spacing:.02em;text-align:justify;font-style:italic}
.parallel-vi{font-size:14px;color:var(--text);line-height:1.75;text-align:justify}
@media(max-width:980px){.parallel{grid-template-columns:1fr;gap:10px}.parallel-zh,.parallel-py{padding-bottom:10px;border-bottom:1px solid #f3f4f6}}

/* Vocab */
.vocab-section{margin-top:30px}
.vocab-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.vocab-title{display:flex;align-items:center;gap:10px;font-family:'Noto Serif TC',serif;font-size:20px;font-weight:700;color:var(--navy)}
.vocab-title i{color:var(--orange);font-size:16px}
.vocab-actions{display:flex;gap:6px}
.vocab-btn-action{font-size:11px;font-weight:600;padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:#fff;color:var(--text-2);cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px;transition:.15s}
.vocab-btn-action:hover{border-color:#9ca3af;color:var(--text)}
.vocab-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:8px}
.vocab-item{background:#fff;border:1px solid var(--border);border-radius:9px;padding:11px 14px;display:flex;align-items:center;gap:14px;transition:.15s}
.vocab-item:hover{border-color:#c7d7fd}
.vocab-char{font-family:'Noto Serif TC',serif;font-size:22px;font-weight:600;color:var(--red);min-width:70px;cursor:pointer;border-radius:6px;padding:4px 8px;text-align:center;transition:.15s}
.vocab-char:hover{background:var(--red-lt)}
.vocab-info{flex:1;min-width:0}
.vocab-pinyin{font-size:11px;color:var(--text-2);font-style:italic;margin-bottom:1px}
.vocab-meaning{font-size:13.5px;font-weight:500;color:var(--text)}
.vocab-example{font-size:11.5px;color:var(--text-3);margin-top:3px;font-style:italic}
.vocab-level{font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:#fdf6e3;color:#b8860b;margin-left:6px}
.vocab-fork{background:#fff;border:1px solid var(--border);font-size:11px;font-weight:500;color:var(--text-2);padding:5px 10px;border-radius:6px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.15s;flex-shrink:0}
.vocab-fork:hover{background:var(--success-lt);border-color:#bbf7d0;color:var(--success)}
.vocab-fork.added{background:var(--success-lt);border-color:#bbf7d0;color:var(--success)}

/* CHAT WIDGET (copied from reading.html) */
.chat-bubble-btn{position:fixed;bottom:24px;right:24px;width:54px;height:54px;border-radius:50%;background:var(--blue);color:#fff;border:none;font-size:22px;cursor:pointer;box-shadow:0 8px 24px rgba(26,86,219,.4);z-index:50;transition:.15s;display:flex;align-items:center;justify-content:center}
.chat-bubble-btn:hover{transform:scale(1.05);background:var(--blue-dark)}
.chat-widget{position:fixed;bottom:90px;right:24px;width:360px;max-width:calc(100vw - 48px);height:500px;max-height:calc(100vh - 120px);background:#fff;border-radius:14px;box-shadow:0 12px 48px rgba(0,0,0,.18);display:none;flex-direction:column;z-index:51;border:1px solid var(--border)}
.chat-widget.open{display:flex}
.chat-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;font-weight:600;color:var(--text)}
.chat-header .dot{width:8px;height:8px;border-radius:50%;background:var(--success)}
.chat-close-btn{margin-left:auto;background:none;border:none;font-size:18px;color:var(--text-3);cursor:pointer;line-height:1}
.chat-messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.chat-msg{padding:9px 12px;border-radius:10px;font-size:13.5px;line-height:1.55;max-width:85%;white-space:pre-wrap;word-break:break-word}
.chat-msg.user{align-self:flex-end;background:var(--blue);color:#fff}
.chat-msg.ai{align-self:flex-start;background:#f3f4f6;color:var(--text)}
.chat-msg.system{align-self:center;background:transparent;color:var(--text-3);font-size:11px;font-style:italic}
.chat-input-row{padding:10px;border-top:1px solid var(--border);display:flex;gap:6px}
.chat-input{flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:7px;font-family:inherit;font-size:13px;outline:none}
.chat-input:focus{border-color:var(--blue)}
.chat-send{background:var(--blue);color:#fff;border:none;padding:8px 14px;border-radius:7px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
.chat-send:hover{background:var(--blue-dark)}

/* HANDWRITING MODAL */
.hw-overlay{display:none;position:fixed;inset:0;z-index:1000;background:rgba(13,27,75,.55);align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.hw-overlay.open{display:flex}
.hw-modal{background:#fff;border-radius:14px;padding:1.75rem;width:92%;max-width:480px;box-shadow:0 12px 48px rgba(0,0,0,.3);position:relative;max-height:92vh;overflow-y:auto}
.hw-close{position:absolute;top:12px;right:14px;background:none;border:none;font-size:22px;color:var(--text-3);cursor:pointer;line-height:1}
.hw-close:hover{color:var(--danger)}
.hw-word-title{font-family:'Noto Serif TC',serif;font-size:28px;font-weight:700;color:var(--blue);text-align:center;margin-bottom:4px}
.hw-sub{font-size:13px;color:var(--text-2);text-align:center;font-style:italic;margin-bottom:4px}
.hw-meaning{font-size:14px;font-weight:500;text-align:center;margin-bottom:1.25rem;color:var(--text)}
.hw-char-nav{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:1rem;flex-wrap:wrap}
.hw-pip{font-family:'Noto Serif TC',serif;font-size:16px;font-weight:600;width:36px;height:36px;border-radius:7px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-2);background:#fff;transition:all .15s}
.hw-pip.active{border-color:var(--blue);color:var(--blue);background:var(--blue-lt)}
.hw-pip.done{border-color:#bbf7d0;color:var(--success);background:var(--success-lt)}
.hw-mode-tabs{display:flex;gap:8px;justify-content:center;margin-bottom:1rem}
.hw-mode-tab{background:#fff;border:1px solid var(--border);font-family:'Be Vietnam Pro',sans-serif;font-size:12px;font-weight:500;padding:6px 18px;border-radius:16px;cursor:pointer;color:var(--text-2);transition:all .15s}
.hw-mode-tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.hw-canvas-wrap{display:flex;justify-content:center;margin-bottom:1rem}
#hw-target{border-radius:10px;background:#fff;border:1px solid var(--border);position:relative;width:200px;height:200px;overflow:hidden}
.hw-grid{position:absolute;background:#e5e7eb}
.hw-controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.hw-btn{background:#fff;border:1px solid var(--border);font-family:'Be Vietnam Pro',sans-serif;font-size:12px;font-weight:500;color:var(--text);padding:8px 18px;border-radius:7px;cursor:pointer;transition:all .15s}
.hw-btn:hover{background:var(--bg)}
.hw-btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.hw-btn.primary:hover{background:var(--blue-dark)}
.hw-btn.danger{border-color:#fcc;color:var(--danger)}
.hw-btn.danger:hover{background:var(--danger-lt)}
.hw-score{text-align:center;font-size:12px;color:var(--text-2);margin-top:10px;min-height:18px}
.hw-score.good{color:var(--success);font-weight:600}

/* SELECTION HIGHLIGHT (matches reading.html) */
.zh-char{display:inline;cursor:text}
.zh-char.selecting{background:rgba(26,86,219,.18)}
.zh-char.hl-1{background:#C0E1D2}
.zh-char.hl-2{background:#FEF3C7}
.zh-char.hl-3{background:#DBEAFE}
.zh-char.hl-4{background:#FCA5A5}
.sel-bar{position:fixed;display:none;background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px 12px;align-items:center;gap:6px;box-shadow:0 8px 32px rgba(0,0,0,.18),0 2px 8px rgba(0,0,0,.08);z-index:9999;pointer-events:auto;white-space:nowrap}
.sel-bar.show{display:flex}
.sel-bar::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);pointer-events:none;border:7px solid transparent;border-top-color:var(--border)}
.sel-bar::before{content:'';position:absolute;top:calc(100% - 1px);left:50%;transform:translateX(-50%);pointer-events:none;z-index:1;border:6px solid transparent;border-top-color:#fff}
.sel-word{font-family:'Noto Serif TC',serif;font-size:18px;font-weight:600;color:var(--blue);margin-right:4px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel-label{font-size:11px;color:var(--text-2)}
.hl-color{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:all .12s;flex-shrink:0}
.hl-color:hover{transform:scale(1.15);border-color:var(--text-2)}
.sel-divider{width:1px;height:20px;background:var(--border);margin:0 2px}
.sel-action{background:var(--surface);border:1px solid var(--border);font-family:'Be Vietnam Pro',sans-serif;font-size:11px;font-weight:500;padding:4px 10px;border-radius:6px;cursor:pointer;white-space:nowrap;transition:all .15s}
.sel-action.add{color:var(--success)}
.sel-action.add:hover{background:var(--success-lt);border-color:#bbf7d0}
.sel-action.clear{color:var(--text-2)}
.sel-action.clear:hover{background:#f3f4f6}
.sel-action.remove{color:var(--danger)}
.sel-action.remove:hover{background:var(--danger-lt);border-color:#fcc}

/* AI VOCAB LOADING */
.ai-loading{display:none;align-items:center;gap:10px;padding:14px 18px;background:var(--blue-lt);border:1px solid #c7d7fd;border-radius:9px;margin-bottom:14px;font-size:13px;color:var(--blue)}
.ai-loading.show{display:flex}
.ai-loading .spinner{width:16px;height:16px;border:2px solid #c7d7fd;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.vocab-btn-action.ai{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border-color:transparent}
.vocab-btn-action.ai:hover{filter:brightness(1.1);color:#fff}

/* WORKSHEET OVERLAY */
.ws-overlay{display:none;position:fixed;inset:0;z-index:1000;background:rgba(13,27,75,.55);align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.ws-overlay.open{display:flex}
.ws-modal{background:#fff;border-radius:14px;padding:1.5rem;width:92%;max-width:520px;max-height:88vh;overflow-y:auto;box-shadow:0 12px 48px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:.75rem}
.ws-modal-header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:.75rem}
.ws-modal-header h3{font-size:16px;color:var(--navy)}
.ws-top-actions{display:flex;gap:8px}
.ws-sm-btn{background:var(--bg);border:1px solid var(--border);font-size:11px;font-weight:500;padding:5px 12px;border-radius:5px;cursor:pointer;font-family:inherit;color:var(--text-2)}
.ws-sm-btn:hover{background:#e5e7eb}
#ws-list{display:flex;flex-direction:column;gap:4px;flex:1;overflow-y:auto;max-height:50vh}
.ws-row{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;cursor:pointer}
.ws-row:hover{background:var(--bg)}
.ws-row input{cursor:pointer}
.ws-zh{font-family:'Noto Serif TC',serif;font-size:16px;color:var(--navy);font-weight:600;min-width:80px}
.ws-py{font-size:11px;color:var(--text-2);font-style:italic;flex:1}
.ws-vn{font-size:12px;color:var(--text-3)}
.ws-footer{padding-top:12px;border-top:1px solid var(--border);display:flex;justify-content:flex-end}
.ws-gen-btn{background:var(--blue);color:#fff;border:none;padding:9px 20px;border-radius:8px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
.ws-gen-btn:hover{background:var(--blue-dark)}

footer{background:#111827;color:rgba(255,255,255,.6);font-size:13px;margin-top:auto}
.footer-inner{border-top:1px solid rgba(255,255,255,.08);padding:14px 1.5rem;display:flex;align-items:center;justify-content:space-between;max-width:1100px;margin:0 auto}

.loading{text-align:center;padding:60px 20px;color:var(--text-3)}
.loading i{font-size:32px;display:block;margin-bottom:10px}

@media(max-width:600px){.nav-link{display:none}.content-card{padding:20px 18px}.para-zh,.parallel-zh{font-size:16.5px}.para-vi,.parallel-vi{font-size:13.5px}.para-pinyin{font-size:12.5px}.chat-widget{right:0;bottom:0;width:100vw;max-width:100vw;height:80vh;border-radius:14px 14px 0 0}}
</style>
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a class="nav-brand" href="/courses.html">
      <img src="images/logo.jpg" alt="TOCFL FAFA" onerror="this.style.display='none'">
      <span class="nav-brand-text">TOCFL <em>FAFA</em></span>
    </a>
    <div class="nav-menu">
      <a class="nav-link" href="/flashcards.html">Flashcard</a>
      <a class="nav-link" href="/courses.html">Khóa học</a>
      <a class="nav-link active" href="/news.html">Đọc báo</a>
      <a class="nav-link" href="/exams.html">Đề thi</a>
      <a class="nav-link" href="/about.html">Giới thiệu</a>
      <a class="nav-link" href="/blog.html">Blog</a>
      <div class="nav-auth" id="nav-auth">
        <a class="nav-btn" href="/courses.html">Bắt đầu học</a>
      </div>
    </div>
  </div>
</nav>

<div class="page">
  <a class="back-btn" href="/news.html"><i class="fa-solid fa-arrow-left"></i> Tất cả bài báo</a>
  <div id="content"><div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> Đang tải bài…</div></div>
</div>

<!-- CHAT BUBBLE -->
<button class="chat-bubble-btn" id="chat-bubble" onclick="chatToggle()" title="Chat AI về bài báo" style="display:none">
  <i class="fa-solid fa-comments"></i>
</button>
<div class="chat-widget" id="chat-widget">
  <div class="chat-header">
    <div class="dot"></div> Chat AI · bài báo
    <button class="chat-close-btn" onclick="chatToggle()">×</button>
  </div>
  <div class="chat-messages" id="chat-msgs">
    <div class="chat-msg system">Hỏi AI về nội dung, ngữ pháp hoặc từ vựng trong bài.</div>
  </div>
  <div class="chat-input-row">
    <input class="chat-input" id="chat-input" placeholder="Hỏi gì đó…"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();chatSend()}">
    <button class="chat-send" onclick="chatSend()">Gửi</button>
  </div>
</div>

<!-- SELECTION HIGHLIGHT BAR -->
<div class="sel-bar" id="sel-bar">
  <span class="sel-word" id="sel-word"></span>
  <span class="sel-label">Highlight:</span>
  <div class="hl-color" style="background:#C0E1D2" onclick="selHighlight('hl-1')" title="Xanh lá"></div>
  <div class="hl-color" style="background:#FEF3C7" onclick="selHighlight('hl-2')" title="Vàng"></div>
  <div class="hl-color" style="background:#DBEAFE" onclick="selHighlight('hl-3')" title="Xanh dương"></div>
  <div class="hl-color" style="background:#FCA5A5" onclick="selHighlight('hl-4')" title="Đỏ"></div>
  <div class="sel-divider"></div>
  <button class="sel-action add" onclick="selAddVocab()">+ Từ vựng</button>
  <button class="sel-action remove" onclick="selRemoveHL()">✕</button>
  <button class="sel-action clear" onclick="selClear()">Bỏ</button>
</div>

<!-- WORKSHEET OVERLAY -->
<div class="ws-overlay" id="ws-overlay" onclick="if(event.target===this)wsClose()">
  <div class="ws-modal">
    <div class="ws-modal-header">
      <h3>📝 Tạo bài tập viết</h3>

<script>
const SB_URL = 'https://prctmferugkxabyizslx.supabase.co';
const SB_KEY = 'sb_publishable_6-_0uUkFDKDCA4HBNdB0Gg_ZEL_GqJQ';
const sb = supabase.createClient(SB_URL, SB_KEY);

const id = +new URLSearchParams(location.search).get('id');
let articleData = null;

if (!id) document.getElementById('content').innerHTML = '<div class="loading">Thiếu id bài báo.</div>';
else load();

function fmt(iso) { return iso ? new Date(iso).toLocaleString('vi-VN', { dateStyle:'medium', timeStyle:'short' }) : ''; }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function splitParas(text, type='zh') {
  if (!text) return [];
  text = text.trim();
  if (text.includes('\n\n')) return text.split(/\n{2,}/).map(p => p.trim()).filter(Boolean);
  const re = type === 'zh' ? /(?<=[。！？])\s*/ : /(?<=[.!?])\s+/;
  const sentences = text.split(re).map(s => s.trim()).filter(Boolean);
  const paras = [];
  for (let i = 0; i < sentences.length; i += 3) paras.push(sentences.slice(i, i+3).join(type === 'zh' ? '' : ' '));
  return paras;
}

async function load() {
  const { data: a, error } = await sb.from('news_articles').select('*').eq('id', id).maybeSingle();
  if (error || !a) {
    document.getElementById('content').innerHTML = `<div class="loading">Không tìm thấy bài (${error?.message || ''}).</div>`;
    return;
  }
  articleData = a;
  document.title = (a.title_zh || 'Bài báo') + ' — TOCFL FAFA';
  render(a);
  document.getElementById('chat-bubble').style.display = 'flex';
}

let activeMode = 'all';

function render(a) {
  const zhParas = splitParas(a.content_zh, 'zh');
  const viParas = splitParas(a.content_vi || '', 'vi');
  const pyParas = splitParas(a.pinyin || '', 'vi');
  const max = Math.max(zhParas.length, viParas.length, pyParas.length);
  while (zhParas.length < max) zhParas.push('');
  while (viParas.length < max) viParas.push('');
  while (pyParas.length < max) pyParas.push('');

  const forks = JSON.parse(localStorage.getItem('tocfl_user_flashcards') || '[]');
  const forkChars = new Set(forks.map(f => f.char));

  const vocabHtml = (a.vocab || []).map((w, i) => `
    <div class="vocab-item" data-idx="${i}">
      <div class="vocab-char" onclick="hwOpen(${i})" title="Click để tập viết">${esc(w.char)}</div>
      <div class="vocab-info">
        <div class="vocab-pinyin">${esc(w.pinyin || '')}${w.level ? `<span class="vocab-level">${esc(w.level)}</span>` : ''}</div>
        <div class="vocab-meaning">${esc(w.meaning || '')}</div>
        ${w.example ? `<div class="vocab-example">${esc(w.example)}${w.exMeaning ? ' — ' + esc(w.exMeaning) : ''}</div>` : ''}
      </div>
      <button class="vocab-fork ${forkChars.has(w.char) ? 'added' : ''}" onclick="forkVocab(${i}, this)">
        <i class="fa-${forkChars.has(w.char) ? 'solid fa-check' : 'regular fa-bookmark'}"></i>
        ${forkChars.has(w.char) ? 'Đã thêm' : 'Flash'}
      </button>
    </div>`).join('');

  document.getElementById('content').innerHTML = `
    <div class="article-meta">
      <span class="article-source">${esc(a.source_name || a.source)}</span>
      <span>·</span>
      <span>${fmt(a.published_at)}</span>
      ${a.category ? `<span class="article-cat-badge">${esc(a.category)}</span>` : ''}
    </div>
    <h1 class="article-title">${esc(a.title_zh)}</h1>
    ${a.title_vi ? `<div class="article-title-vi">${esc(a.title_vi)}</div>` : ''}
    <a class="article-source-link" href="${esc(a.source_url)}" target="_blank" rel="noopener">
      <i class="fa-solid fa-external-link"></i> Xem nguyên văn tại ${esc(a.source_name || a.source)}
    </a>
    <div class="tabs">
      <button class="tab" data-mode="zh">繁體中文</button>
      <button class="tab" data-mode="pinyin">Pinyin</button>
      <button class="tab" data-mode="vi">Tiếng Việt</button>
      <button class="tab active" data-mode="all">Tất cả</button>
    </div>
    <article class="content-card" id="content-card"></article>
    <div class="vocab-section">
      <div class="vocab-head">
        <div class="vocab-title" id="vocab-title-h"><i class="fa-solid fa-book-open"></i> Từ vựng (${a.vocab?.length || 0})</div>
        <div class="vocab-actions">
          <button class="vocab-btn-action ai" onclick="aiGenVocab()" id="ai-gen-btn"><i class="fa-solid fa-wand-magic-sparkles"></i> Phân tích &amp; tạo từ vựng AI</button>
          <button class="vocab-btn-action" onclick="exportCsv()"><i class="fa-solid fa-download"></i> CSV</button>
          <button class="vocab-btn-action" onclick="wsOpen()"><i class="fa-solid fa-print"></i> Bài tập viết</button>
          <button class="vocab-btn-action" onclick="forkAll()"><i class="fa-solid fa-bookmark"></i> Flash tất cả</button>
        </div>
      </div>
      <div class="ai-loading" id="ai-ld"><div class="spinner"></div><span id="ai-lt">AI đang phân tích bài báo…</span></div>
      <div class="vocab-list" id="vocab-list">${vocabHtml}</div>
    </div>
    <div id="comments-root" style="margin-top:40px"></div>
  `;

  // Wrap each Chinese char in <span class="zh-char"> for selection
  function wrapZh(text) {
    return [...(text || '')].map(c => `<span class="zh-char">${esc(c)}</span>`).join('');
  }

  const card = document.getElementById('content-card');
  function renderMode() {
    if (activeMode === 'zh') {
      card.innerHTML = zhParas.map(p => `<div class="para"><div class="para-zh">${wrapZh(p)}</div></div>`).join('');
    } else if (activeMode === 'pinyin') {
      card.innerHTML = pyParas.map(p => `<div class="para"><div class="para-pinyin">${wrapZh(p)}</div></div>`).join('');
    } else if (activeMode === 'vi') {
      card.innerHTML = viParas.map(p => `<div class="para"><div class="para-vi">${wrapZh(p)}</div></div>`).join('');
    } else {
      card.innerHTML = zhParas.map((zh, i) => `
        <div class="parallel">
          <div class="parallel-zh">${wrapZh(zh)}</div>
          <div class="parallel-py">${wrapZh(pyParas[i] || '')}</div>
          <div class="parallel-vi">${wrapZh(viParas[i] || '')}</div>
        </div>`).join('');
    }
  }
  renderMode();
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
    activeMode = t.dataset.mode;
    renderMode();
  }));

  if (window.mountComments) {
    window.mountComments({
      container: '#comments-root',
      entityType: 'news_article',
      entityId: String(a.id),
      supabaseUrl: SB_URL, supabaseKey: SB_KEY,
    });
  }
}

// ─── FLASHCARD FORK (localStorage) ──────────────────────────────
function forkVocab(idx, btn) {
  const w = articleData?.vocab?.[idx]; if (!w) return;
  const list = JSON.parse(localStorage.getItem('tocfl_user_flashcards') || '[]');
  if (list.find(f => f.char === w.char)) {
    btn.classList.remove('added'); btn.innerHTML = `<i class="fa-regular fa-bookmark"></i> Flash`;
    localStorage.setItem('tocfl_user_flashcards', JSON.stringify(list.filter(f => f.char !== w.char)));
    return;
  }
  list.push({
    char: w.char, pinyin: w.pinyin, meaning: w.meaning,
    example_zh: w.example, example_vi: w.exMeaning,
    source: 'news', source_id: articleData.id, added_at: Date.now(),
  });
  localStorage.setItem('tocfl_user_flashcards', JSON.stringify(list));
  btn.classList.add('added');
  btn.innerHTML = `<i class="fa-solid fa-check"></i> Đã thêm`;
}

function forkAll() {
  let added = 0;
  document.querySelectorAll('.vocab-fork:not(.added)').forEach(btn => {
    const item = btn.closest('.vocab-item');
    const idx = +item.dataset.idx;
    forkVocab(idx, btn);
    added++;
  });
  alert(`Đã thêm ${added} từ vào flashcard.`);
}

// ─── CSV EXPORT ─────────────────────────────────────────────────
function exportCsv() {
  const v = articleData?.vocab || [];
  if (!v.length) return;
  const rows = [['Hán', 'Pinyin', 'Nghĩa', 'Ví dụ', 'Dịch ví dụ', 'Cấp']];
  v.forEach(w => rows.push([w.char, w.pinyin, w.meaning, w.example || '', w.exMeaning || '', w.level || '']));
  const csv = rows.map(r => r.map(c => `"${String(c||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `vocab-${articleData.id}.csv`;
  a.click();
}

// ─── CHAT AI ────────────────────────────────────────────────────
const chatHistory = [];
function chatToggle() { document.getElementById('chat-widget').classList.toggle('open'); }
async function chatSend() {
  const input = document.getElementById('chat-input');
  const msg = input.value.trim(); if (!msg) return;
  input.value = '';
  const msgs = document.getElementById('chat-msgs');
  msgs.innerHTML += `<div class="chat-msg user">${esc(msg)}</div>`;
  msgs.scrollTop = msgs.scrollHeight;

  const a = articleData;
  const sysPrompt = `Bạn là giáo viên tiếng Trung phồn thể (繁體中文 Đài Loan) cho học viên Việt. Học viên đang đọc 1 bài báo Đài Loan và muốn hỏi về nó.

Bài báo:
Tiêu đề: ${a.title_zh}
Nguồn: ${a.source_name || a.source}
Nội dung:
${a.content_zh}

Hãy trả lời câu hỏi của học viên một cách rõ ràng, ngắn gọn, dễ hiểu. Có thể trích dẫn nguyên văn từ bài. Trả lời bằng tiếng Việt; nếu trích chữ Hán giữ nguyên 繁體.`;

  chatHistory.push({ role: 'user', content: msg });

  msgs.innerHTML += `<div class="chat-msg ai" id="chat-loading"><i class="fa-solid fa-spinner fa-spin"></i></div>`;
  msgs.scrollTop = msgs.scrollHeight;

  try {
    const res = await fetch('/api/ai/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: [{ role: 'system', content: sysPrompt }, ...chatHistory],
        max_tokens: 1500,
        temperature: 0.4,
      }),
    });
    const j = await res.json();
    document.getElementById('chat-loading')?.remove();
    if (!res.ok || j.error) throw new Error(j.error || `HTTP ${res.status}`);
    const reply = j.content || '(không có phản hồi)';
    chatHistory.push({ role: 'assistant', content: reply });
    msgs.innerHTML += `<div class="chat-msg ai">${esc(reply).replace(/\n/g, '<br>')}</div>`;
    msgs.scrollTop = msgs.scrollHeight;
  } catch (e) {
    document.getElementById('chat-loading')?.remove();
    msgs.innerHTML += `<div class="chat-msg ai">⚠ ${esc(e.message)}</div>`;
  }
}

// ─── HANDWRITING (Hanzi Writer) ─────────────────────────────────
let hwState = { chars: [], idx: 0, mode: 'a', writer: null, done: [] };

function hwOpen(vocabIdx) {
  const w = articleData?.vocab?.[vocabIdx]; if (!w) return;
  hwState.chars = [...w.char];
  hwState.idx = 0;
  hwState.done = hwState.chars.map(() => false);
  hwState.mode = 'a';
  document.getElementById('hw-title').textContent = w.char;
  document.getElementById('hw-py').textContent = w.pinyin || '';
  document.getElementById('hw-mg').textContent = w.meaning || '';
  document.getElementById('hw-sc').textContent = '';
  document.getElementById('mt-a').classList.add('active');
  document.getElementById('mt-q').classList.remove('active');
  document.getElementById('hw-ca').style.display = 'flex';
  document.getElementById('hw-cq').style.display = 'none';
  hwRenderNav();
  document.getElementById('hw-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  hwLoadChar(0);
}

function hwClose() {
  document.getElementById('hw-overlay').classList.remove('open');
  document.body.style.overflow = '';
  if (hwState.writer) { hwState.writer.cancelAnimation?.(); hwState.writer.cancelQuiz?.(); hwState.writer = null; }
}

function hwSelectChar(i) { hwState.idx = i; hwRenderNav(); hwLoadChar(i); }

function hwSetMode(m) {
  hwState.mode = m;
  document.getElementById('mt-a').classList.toggle('active', m === 'a');
  document.getElementById('mt-q').classList.toggle('active', m === 'q');
  document.getElementById('hw-ca').style.display = m === 'a' ? 'flex' : 'none';
  document.getElementById('hw-cq').style.display = m === 'q' ? 'flex' : 'none';
  document.getElementById('hw-sc').textContent = '';
  hwLoadChar(hwState.idx);
}

function hwRenderNav() {
  if (hwState.chars.length <= 1) { document.getElementById('hw-nav').innerHTML = ''; return; }
  document.getElementById('hw-nav').innerHTML = hwState.chars.map((c, i) =>
    `<div class="hw-pip ${i === hwState.idx ? 'active' : ''} ${hwState.done[i] ? 'done' : ''}" onclick="hwSelectChar(${i})">${esc(c)}</div>`
  ).join('');
}

function hwLoadChar(i) {
  const target = document.getElementById('hw-target');
  // Clear previous (preserve grid)
  [...target.querySelectorAll('svg')].forEach(s => s.remove());
  if (hwState.writer) { hwState.writer.cancelAnimation?.(); hwState.writer.cancelQuiz?.(); }
  if (typeof HanziWriter === 'undefined') { document.getElementById('hw-sc').textContent = '⚠ Hanzi Writer chưa load'; return; }
  hwState.writer = HanziWriter.create('hw-target', hwState.chars[i], {
    width: 200, height: 200, padding: 5,
    showOutline: hwState.mode === 'a',
    showCharacter: hwState.mode === 'a',
    strokeAnimationSpeed: 1, delayBetweenStrokes: 200,
  });
  if (hwState.mode === 'a') hwState.writer.animateCharacter();
}

function hwAnimate() { if (hwState.writer) hwState.writer.animateCharacter(); }
function hwLoop() {
  if (!hwState.writer) return;
  hwState.writer.animateCharacter({ onComplete: () => setTimeout(hwLoop, 800) });
}
function hwQuiz() {
  if (!hwState.writer) return;
  document.getElementById('hw-sc').textContent = '';
  hwState.writer.quiz({
    onComplete: ({ totalMistakes }) => {
      const sc = document.getElementById('hw-sc');
      sc.textContent = totalMistakes === 0 ? '✓ Hoàn hảo!' : `Hoàn thành · ${totalMistakes} lỗi`;
      sc.classList.toggle('good', totalMistakes === 0);
      hwState.done[hwState.idx] = true;
      hwRenderNav();
    },
  });
}
function hwReset() {
  document.getElementById('hw-sc').textContent = '';
  hwLoadChar(hwState.idx);
}

// ─── SELECTION HIGHLIGHT (ephemeral — clears on reload / re-render) ─
let selState = { text: '', spans: [] };

document.addEventListener('mouseup', e => {
  if (e.target.closest('#sel-bar')) return;
  setTimeout(() => {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount) return;
    const range = sel.getRangeAt(0);
    const allSpans = [...document.querySelectorAll('.zh-char')];
    const selected = allSpans.filter(s => range.intersectsNode(s));
    if (!selected.length) return;
    selState.text = selected.map(s => s.textContent).join('');
    selState.spans = selected;
    selected.forEach(s => s.classList.add('selecting'));
    const rect = range.getBoundingClientRect();
    selShowBar(rect);
  }, 0);
});
document.addEventListener('mousedown', e => { if (!e.target.closest('#sel-bar')) selClear(); });

function selShowBar(rect) {
  const bar = document.getElementById('sel-bar');
  document.getElementById('sel-word').textContent = selState.text;
  bar.classList.add('show');
  // Measure after show so width is known
  const bw = bar.offsetWidth || 380;
  const midX = (rect.left + rect.right) / 2;
  let left = midX - bw / 2;
  left = Math.max(8, Math.min(window.innerWidth - bw - 8, left));
  bar.style.left = left + 'px';
  let top = rect.top - bar.offsetHeight - 10;
  if (top < 8) top = rect.bottom + 10;
  bar.style.top = top + 'px';
}

function selHighlight(cls) {
  selState.spans.forEach(s => {
    s.classList.remove('hl-1','hl-2','hl-3','hl-4','selecting');
    s.classList.add(cls);
  });
  selClear();
}

function selRemoveHL() {
  selState.spans.forEach(s => s.classList.remove('hl-1','hl-2','hl-3','hl-4','selecting'));
  selClear();
}

function selAddVocab() {
  if (!selState.text) return;
  const word = selState.text.trim();
  if (!word) return;
  // Check if already exists
  if ((articleData.vocab || []).find(w => w.char === word)) {
    alert('Đã có trong danh sách từ vựng.');
    selClear(); return;
  }
  // Add stub vocab entry, optionally enrich with AI later
  articleData.vocab = articleData.vocab || [];
  articleData.vocab.push({
    char: word,
    pinyin: '',
    meaning: '(do người dùng thêm)',
    example: '',
    exMeaning: '',
    level: '',
  });
  selClear();
  // Re-render whole article to refresh vocab list
  render(articleData);
  // Optionally trigger AI enrichment
  enrichUserVocab(word, articleData.vocab.length - 1);
}

async function enrichUserVocab(word, idx) {
  try {
    const res = await fetch('/api/ai/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        max_tokens: 400, temperature: 0.2,
        messages: [
          { role: 'system', content: 'Bạn là từ điển Trung-Việt. Trả JSON {"pinyin":"có dấu thanh","meaning":"nghĩa Việt ngắn","example":"câu Trung phồn thể","exMeaning":"dịch câu"}. KHÔNG markdown.' },
          { role: 'user', content: `Từ: ${word}\n\nNgữ cảnh bài: ${(articleData.content_zh || '').slice(0, 400)}` },
        ],
      }),
    });
    const j = await res.json();
    if (!res.ok || j.error) return;
    const data = JSON.parse(j.content.trim().replace(/^```json\s*/, '').replace(/\s*```\s*$/, ''));
    if (articleData.vocab[idx]) {
      Object.assign(articleData.vocab[idx], { pinyin: data.pinyin || '', meaning: data.meaning || '', example: data.example || '', exMeaning: data.exMeaning || '' });
      render(articleData);
    }
  } catch (e) { console.warn('enrich failed', e); }
}

function selClear() {
  document.querySelectorAll('.zh-char.selecting').forEach(s => s.classList.remove('selecting'));
  selState.text = ''; selState.spans = [];
  document.getElementById('sel-bar').classList.remove('show');
  window.getSelection()?.removeAllRanges();
}

// ─── WORKSHEET ──────────────────────────────────────────────────
function wsOpen() {
  const v = articleData?.vocab || [];
  if (!v.length) { alert('Không có từ vựng.'); return; }
  document.getElementById('ws-list').innerHTML = v.map((w, i) => `
    <label class="ws-row">
      <input type="checkbox" class="ws-cb" data-i="${i}" checked>
      <span class="ws-zh">${esc(w.char)}</span>
      <span class="ws-py">${esc(w.pinyin || '')}</span>
      <span class="ws-vn">${esc(w.meaning || '')}</span>
    </label>`).join('');
  document.getElementById('ws-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function wsClose() {
  document.getElementById('ws-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function wsSelectAll()  { document.querySelectorAll('.ws-cb').forEach(cb => cb.checked = true); }
function wsSelectNone() { document.querySelectorAll('.ws-cb').forEach(cb => cb.checked = false); }

function wsGenerate() {
  const selected = [...document.querySelectorAll('.ws-cb:checked')]
    .map(cb => articleData.vocab[+cb.dataset.i])
    .filter(Boolean);
  if (!selected.length) { alert('Chọn ít nhất 1 từ.'); return; }
  wsClose();
  const win = window.open('', '_blank');
  win.document.write(wsBuildHTML(selected, articleData.title_zh || 'Bài báo'));
  win.document.close();
}

function wsBuildHTML(vocab, title) {
  const SZ = 58, N = 10;
  let rowsHTML = '', initJS = '';
  vocab.forEach((w, wi) => {
    const chars = [...w.char].filter(c => /[一-鿿]/.test(c));
    rowsHTML += `<div class="word-hd">${w.char}<span class="py">${w.pinyin || ''}</span><span class="vn">${w.meaning || ''}</span></div>`;
    chars.forEach((ch, ci) => {
      const eId = `e-${wi}-${ci}`;
      const pIds = Array.from({ length: N }, (_, k) => `p-${wi}-${ci}-${k}`);
      const grid = `<div class="gl"></div><div class="gv"></div>`;
      rowsHTML += `<div class="row"><div class="box ex" id="${eId}">${grid}</div>${pIds.map(id => `<div class="box pr" id="${id}">${grid}</div>`).join('')}</div>`;
      initJS += `HanziWriter.create('${eId}','${ch}',{width:${SZ},height:${SZ},padding:4,showOutline:false,showCharacter:true,strokeColor:'#111'});\n`;
      pIds.forEach(id => {
        initJS += `HanziWriter.create('${id}','${ch}',{width:${SZ},height:${SZ},padding:4,showOutline:true,showCharacter:false,outlineColor:'#bbb'});\n`;
      });
    });
  });
  return `<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><title>漢字練習</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Be+Vietnam+Pro:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7/dist/hanzi-writer.min.js"><\/script>
<style>
@page{size:A4 portrait;margin:12mm}*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Be Vietnam Pro',sans-serif;background:#fff;padding:10px}
.print-bar{display:flex;align-items:center;gap:10px;padding-bottom:12px;margin-bottom:10px;border-bottom:1px solid #e0d8cc}
.print-btn{background:#1a1208;color:#fff;border:none;padding:7px 20px;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit}
.print-hint{font-size:11px;color:#999}
h1{font-family:'Noto Serif TC',serif;font-size:15px;color:#333;margin-bottom:12px}
.word-hd{font-family:'Noto Serif TC',serif;font-size:13px;font-weight:600;color:#444;margin:12px 0 4px}
.word-hd .py{color:#888;font-style:italic;font-weight:400;margin-left:8px;font-family:'Be Vietnam Pro',sans-serif}
.word-hd .vn{color:#888;font-weight:400;margin-left:6px;font-family:'Be Vietnam Pro',sans-serif}
.row{display:flex;gap:3px;margin-bottom:3px;page-break-inside:avoid}
.box{width:${SZ}px;height:${SZ}px;border:1px solid #bbb;position:relative;flex-shrink:0;background:#fff}
.ex{border:2px solid #333}
.gl{position:absolute;top:50%;left:0;width:100%;height:1px;background:#e5ddd2}
.gv{position:absolute;left:50%;top:0;height:100%;width:1px;background:#e5ddd2}
@media print{.print-bar{display:none}body{padding:0}}
</style></head><body>
<div class="print-bar"><button class="print-btn" onclick="window.print()">🖨 In / Lưu PDF</button>
<span class="print-hint">Chọn "Save as PDF" trong hộp thoại in để lưu file</span></div>
<h1>${title} · 漢字練習</h1>
${rowsHTML}
<script>window.onload=function(){try{${initJS}}catch(e){console.error(e)}};<\/script>
</body></html>`;
}

// ─── AI VOCAB GENERATION ────────────────────────────────────────
async function aiGenVocab() {
  if (!articleData) return;
  const existing = articleData.vocab || [];
  if (existing.length > 0 && !confirm('Bài này đã có từ vựng. Tạo lại bằng AI?')) return;
  const btn = document.getElementById('ai-gen-btn');
  const ld  = document.getElementById('ai-ld');
  const userAdded = existing.filter(v => v.userAdded);
  btn.disabled = true;
  ld.classList.add('show');
  document.getElementById('ai-lt').textContent = 'AI đang phân tích bài báo…';

  const SYSTEM_PROMPT = `Bạn là giáo viên tiếng Trung phồn thể Đài Loan (繁體中文，台灣) chuyên giúp người Việt đọc báo. Nhiệm vụ: phân tích bài báo và tạo danh sách 25-30 từ/cụm từ THIẾT YẾU để học viên nắm được ngữ cảnh, nhân vật, sự kiện và thông điệp chính của bài.

NGUYÊN TẮC BẮT BUỘC:
- Chỉ chọn từ/cụm từ có TỪ 2 CHỮ TRỞ LÊN. Tuyệt đối không chọn từ đơn 1 chữ.
- Bắt buộc dùng 繁體中文 (Đài Loan), KHÔNG dùng giản thể.
- Tập trung vào:
  * DANH TỪ (tên người, tổ chức, địa danh, khái niệm trung tâm bài)
  * ĐỘNG TỪ / CỤM ĐỘNG TỪ quyết định diễn biến sự kiện
  * THUẬT NGỮ chuyên ngành (chính trị, kinh tế, xã hội…) liên quan đến chủ đề bài
  * Thành ngữ, cụm cố định, collocations xuất hiện trong bài
- KHÔNG chọn: từ hư (的、了、在、是、也、都), từ quá cơ bản

Yêu cầu bắt buộc:
- Số lượng: 25-30 mục
- example PHẢI là câu/cụm NGUYÊN VĂN từ bài báo chứa từ đó
- exMeaning giải thích nghĩa trong ngữ cảnh câu

Trả JSON object: {"vocab":[{"char":"行政院","pinyin":"xíngzhèng yuàn","meaning":"viện hành chính","example":"行政院今日召開記者會","exMeaning":"Viện hành chính hôm nay tổ chức họp báo","level":"trung cấp"}]}
level: "cơ bản" / "trung cấp" / "nâng cao". KHÔNG markdown.`;

  try {
    const res = await fetch('/api/ai/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        max_tokens: 4000, temperature: 0.3,
        response_format: { type: 'json_object' },
        messages: [
          { role: 'system', content: SYSTEM_PROMPT },
          { role: 'user',   content: `Tiêu đề: ${articleData.title_zh}\n\nNội dung bài (繁體中文):\n${articleData.content_zh}\n\nHãy tạo 25-30 từ/cụm từ THIẾT YẾU. Trả JSON object đúng schema.` },
        ],
      }),
    });
    const j = await res.json();
    if (!res.ok || j.error) throw new Error(j.error || `HTTP ${res.status}`);
    const raw = j.content.trim().replace(/^```json\s*/, '').replace(/\s*```$/, '');
    const parsed = JSON.parse(raw);
    const list = Array.isArray(parsed) ? parsed : (parsed.vocab || []);
    if (!list.length) throw new Error('AI không trả từ vựng');
    articleData.vocab = [...list, ...userAdded];
    ld.classList.remove('show');
    btn.disabled = false;
    btn.innerHTML = `<i class="fa-solid fa-rotate"></i> Tạo lại (${list.length})`;
    render(articleData);
  } catch (e) {
    ld.classList.remove('show');
    btn.disabled = false;
    btn.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> ${esc(e.message.slice(0, 30))}`;
    console.error(e);
  }
}
</script>
