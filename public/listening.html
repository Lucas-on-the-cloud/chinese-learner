<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luyện nghe — TOCFL FAFA</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/user-session.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Be Vietnam Pro',sans-serif;font-size:15px;color:#1f2937;background:#f4f5f7;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}
a{text-decoration:none;color:inherit}
:root{
  --navy:#0d1b4b;--blue:#1a56db;--blue-lt:#eff6ff;
  --green:#16a34a;--green-lt:#f0fdf4;
  --red:#dc2626;--red-lt:#fef2f2;
  --orange:#f47b20;
  --text:#1f2937;--text-2:#6b7280;--text-3:#9ca3af;
  --bg:#f4f5f7;--border:#e5e7eb;--surface:#fff;
}

/* NAVBAR */
.navbar{position:sticky;top:0;z-index:200;background:#fff;border-bottom:1px solid var(--border);height:62px;display:flex;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.nb-inner{max-width:900px;margin:0 auto;padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;width:100%}
.nav-brand{display:flex;align-items:center;gap:10px}
.nav-brand-text{font-family:'Noto Serif TC',serif;font-size:18px;font-weight:700;color:var(--navy)}
.nav-brand-text em{color:var(--orange);font-style:normal}
.nav-menu{display:flex;align-items:center;gap:2px}
.nav-link{font-size:14px;font-weight:500;color:var(--text-2);padding:6px 12px;border-radius:6px;transition:all .15s}
.nav-link:hover{color:var(--text);background:#f3f4f6}
.nav-link.active{color:var(--blue);font-weight:600}

/* HEADER */
.content-header{background:linear-gradient(135deg,var(--navy) 0%,#1e3a8a 100%);padding:32px 1.5rem 40px;position:relative;overflow:hidden}
.content-header::after{content:'聽';position:absolute;font-family:'Noto Serif TC',serif;font-size:260px;font-weight:700;color:rgba(255,255,255,.04);bottom:-80px;right:4%;pointer-events:none}
.ch-inner{max-width:900px;margin:0 auto}
.ch-back{display:inline-flex;align-items:center;gap:6px;color:rgba(255,255,255,.65);font-size:12px;font-weight:500;background:rgba(255,255,255,.1);padding:5px 14px;border-radius:6px;margin-bottom:14px;border:none;cursor:pointer;font-family:inherit;transition:all .15s}
.ch-back:hover{color:#fff;background:rgba(255,255,255,.18)}
.ch-eyebrow{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);color:rgba(255,255,255,.9);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;padding:4px 14px;border-radius:50px;margin-bottom:.85rem}
.content-header h1{font-family:'Noto Serif TC',serif;font-size:clamp(20px,3vw,28px);font-weight:700;color:#fff;margin-bottom:.4rem}
.content-header p{font-size:13px;color:rgba(255,255,255,.7);line-height:1.75;max-width:500px}

/* MAIN */
.app-main{flex:1;max-width:900px;width:100%;margin:0 auto;padding:24px 1.5rem 60px}

/* LIST VIEW */
.list-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:12px}
.list-hd{display:flex;align-items:center;gap:14px;padding:16px 20px;cursor:pointer;transition:background .12s}
.list-hd:hover{background:#f8faff}
.list-num{width:38px;height:38px;border-radius:9px;background:linear-gradient(135deg,var(--navy),#1e3a8a);display:flex;align-items:center;justify-content:center;font-family:'Noto Serif TC',serif;font-size:15px;color:#fff;font-weight:700;flex-shrink:0}
.list-info{flex:1}
.list-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:2px}
.list-sub{font-size:12px;color:var(--text-3)}
.list-badge{font-size:11px;font-weight:600;color:var(--blue);background:var(--blue-lt);padding:3px 10px;border-radius:8px}
.list-prog{height:3px;background:#f3f4f6}
.list-prog-fill{height:100%;background:linear-gradient(90deg,var(--blue),#3b82f6);transition:width .4s}

/* LOADING */
.loading-spinner{text-align:center;padding:3rem;color:var(--text-3);font-size:13px}

/* ── MODE TABS ─────────────────────────────────── */
.mode-tabs{display:flex;gap:4px;margin-bottom:16px}
.mode-tab{flex:1;padding:9px 0;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);font-family:'Be Vietnam Pro',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.mode-tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.mode-tab:not(.active):hover{border-color:#9ca3af;color:var(--text)}

/* ── EXERCISE CARD ──────────────────────────────── */
.ex-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}

/* Nav row */
.ex-nav{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #f3f4f6}
.ex-nav-left{display:flex;align-items:center;gap:2px}
.ex-nav-right{display:flex;align-items:center;gap:2px}
.nav-icon-btn{background:none;border:none;color:var(--text-2);width:32px;height:32px;border-radius:7px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:all .12s}
.nav-icon-btn:hover{background:#f3f4f6;color:var(--text)}
.nav-counter{font-size:13px;font-weight:600;color:var(--text-2);padding:0 8px;white-space:nowrap}
.nav-speed-btn{background:none;border:none;color:var(--text-2);font-family:'Be Vietnam Pro',sans-serif;font-size:12px;font-weight:600;padding:4px 8px;border-radius:6px;cursor:pointer;transition:all .12s}
.nav-speed-btn:hover{background:#f3f4f6}
.nav-sep{width:1px;height:18px;background:var(--border);margin:0 4px;flex-shrink:0}

/* Speed pills */
.speed-row{display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:1px solid #f3f4f6}
.speed-row-label{font-size:11px;font-weight:600;color:var(--text-3)}
.speed-pill{font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);cursor:pointer;transition:all .12s;font-family:inherit}
.speed-pill.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.speed-pill:not(.active):hover{border-color:#9ca3af}

/* Keyboard hints */
.kbd-hint{padding:10px 14px;font-size:11px;color:var(--text-3);display:flex;align-items:center;gap:6px;flex-wrap:wrap;border-top:1px solid #f9fafb}
.kbd{display:inline-block;padding:1px 6px;background:#f3f4f6;border:1px solid #d1d5db;border-radius:4px;font-size:10px;font-family:monospace;color:var(--text-2)}

/* ── NGHE CHECK ─────────────────────────────────── */
.check-body{padding:16px 14px 12px}
.word-display{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:48px;margin-bottom:16px}
.word-token{font-family:'Noto Serif TC',serif;font-size:22px;font-weight:600;color:var(--navy);line-height:1}
.word-token.punct{color:var(--text-3);font-size:18px}
.word-box{display:inline-block;height:28px;border-radius:6px;background:#e5e7eb;cursor:pointer;transition:all .15s;vertical-align:middle}
.word-box:hover{background:#d1d5db}

.reveal-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.reveal-btn{display:flex;align-items:center;gap:5px;padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);font-family:'Be Vietnam Pro',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .12s}
.reveal-btn:hover{border-color:#9ca3af;color:var(--text)}
.reveal-btn i{font-size:11px;color:var(--text-3)}
.reveal-sep{color:var(--border);font-size:16px}
.reset-btn{display:flex;align-items:center;gap:5px;padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text-3);font-family:'Be Vietnam Pro',sans-serif;font-size:12px;cursor:pointer;transition:all .12s}
.reset-btn:hover{color:var(--text);border-color:#9ca3af}

/* ── NGHE CHÉP ──────────────────────────────────── */
.dictation-body{padding:12px 14px}
.dictation-input{width:100%;padding:14px;border:2px solid var(--blue);border-radius:10px;font-family:monospace;font-size:17px;outline:none;resize:none;line-height:1.7;color:var(--text);background:#fafeff;min-height:100px}
.dictation-input:focus{box-shadow:0 0 0 3px rgba(26,86,219,.12)}
.score-row{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:13px}
.score-text{color:var(--text-2);font-weight:500}
.score-pct{font-weight:700;color:var(--text)}
.dots-row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;padding:2px 0}
.dot-group{display:flex;gap:3px}
.dot{width:7px;height:7px;border-radius:50%;background:#d1d5db}
.dot.correct{background:var(--green)}
.dot.wrong{background:var(--red)}

/* ── NGHE FULL ──────────────────────────────────── */
.full-player{padding:24px 14px 16px;display:flex;flex-direction:column;align-items:center;gap:14px}
.full-btns{display:flex;align-items:center;gap:18px}
.full-prev-btn,.full-next-btn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface);color:var(--text-2);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.full-prev-btn:hover,.full-next-btn:hover{border-color:#9ca3af;color:var(--text)}
.full-prev-btn:disabled,.full-next-btn:disabled{opacity:.35;cursor:not-allowed}
.full-play-btn{width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;border:none;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;box-shadow:0 4px 16px rgba(26,86,219,.35)}
.full-play-btn:hover{background:#1544b8;box-shadow:0 6px 20px rgba(26,86,219,.45)}
.full-counter{font-size:14px;color:var(--text-2);font-weight:500}
.full-counter strong{color:var(--text)}
.full-ctrl-row{display:flex;align-items:center;gap:0;flex-wrap:wrap;justify-content:center;gap:8px}
.full-ctrl-btn{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);font-family:'Be Vietnam Pro',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .12s}
.full-ctrl-btn:hover{border-color:#9ca3af;color:var(--text)}
.full-ctrl-btn.on{background:var(--blue-lt);color:var(--blue);border-color:#c7d7fd}
.full-ctrl-btn i{font-size:11px}

.transcript-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;margin-top:12px}
.tc-label{font-size:10px;font-weight:700;letter-spacing:1.2px;color:var(--text-3);text-transform:uppercase;margin-bottom:10px}
.tc-text{font-family:'Noto Serif TC',serif;font-size:20px;font-weight:600;color:var(--navy);line-height:1.75;letter-spacing:.5px}
.tc-vi-label{font-size:10px;font-weight:700;letter-spacing:1.2px;color:var(--text-3);text-transform:uppercase;margin-top:14px;margin-bottom:6px}
.tc-vi-text{font-size:14px;color:var(--text-2);font-style:italic;line-height:1.7}

.seg-list-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;margin-top:12px}
.sl-label{font-size:10px;font-weight:700;letter-spacing:1.2px;color:var(--text-3);text-transform:uppercase;margin-bottom:12px}
.sl-circles{display:flex;flex-wrap:wrap;gap:8px}
.sl-circle{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--text-2);cursor:pointer;transition:all .15s;flex-shrink:0}
.sl-circle:hover{border-color:#9ca3af;color:var(--text)}
.sl-circle.done{background:var(--green-lt);border-color:#bbf7d0;color:var(--green)}
.sl-circle.active{background:var(--navy);border-color:var(--navy);color:#fff}

/* DONE */
.done-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:3rem;text-align:center}
.done-score{font-size:40px;font-weight:700;color:var(--blue);margin-bottom:.4rem}

/* FOOTER */
footer{background:#111827;color:rgba(255,255,255,.6);font-size:13px;margin-top:auto}
.footer-inner{border-top:1px solid rgba(255,255,255,.08);padding:14px 1.5rem;display:flex;align-items:center;justify-content:space-between;max-width:900px;margin:0 auto}

@media(max-width:640px){
  .nav-menu .nav-link{display:none}
  .mode-tab{font-size:12px;padding:8px 0}
  .word-token{font-size:18px}
  .tc-text{font-size:17px}
}
</style>
</head>
<body>

<nav class="navbar">
  <div class="nb-inner">
    <a class="nav-brand" href="/about.html">
      <span class="nav-brand-text">TOCFL <em>FAFA</em></span>
    </a>
    <div class="nav-menu">
      <a class="nav-link" href="/flashcards.html">Flashcard</a>
      <a class="nav-link active" href="/courses.html">Khóa học</a>
      <a class="nav-link" href="/about.html">Giới thiệu</a>
      <a class="nav-link" href="/blog.html">Blog</a>
    </div>
  </div>
</nav>

<div class="content-header">
  <div class="ch-inner">
    <button class="ch-back" id="ch-back-btn" onclick="goBack()">
      <i class="fas fa-arrow-left"></i> Quay lại
    </button>
    <div class="ch-eyebrow"><i class="fas fa-headphones" style="font-size:10px"></i>&nbsp; 聽力練習 · Luyện nghe</div>
    <h1 id="page-h1">Luyện nghe & Chép chính tả</h1>
    <p id="page-desc">Nghe từng đoạn — chọn mode phù hợp với trình độ của bạn.</p>
  </div>
</div>

<main class="app-main" id="app-main">
  <div class="loading-spinner">
    <i class="fa-solid fa-spinner fa-spin" style="font-size:22px;margin-bottom:10px;display:block"></i>
    Đang tải…
  </div>
</main>

<footer>
  <div class="footer-inner">
    <span>TOCFL FAFA © 2026 · Học tiếng Trung phồn thể dành cho người Việt</span>
    <a href="/courses.html" style="color:rgba(255,255,255,.5)">Khóa học</a>
  </div>
</footer>

<audio id="main-audio" preload="auto"></audio>

<script>
const DB_URL = 'https://prctmferugkxabyizslx.supabase.co';
const DB_KEY = 'sb_publishable_6-_0uUkFDKDCA4HBNdB0Gg_ZEL_GqJQ';
const db = supabase.createClient(DB_URL, DB_KEY);

window.userSession = new UserSession(db);
window.userSession.init().then(() => window.userSession.migrateFromLocalStorage());

// ─── URL params ──────────────────────────────────
const params      = new URLSearchParams(location.search);
let   bookName    = params.get('b') || '';
let   lessonId    = params.get('lesson') ? parseInt(params.get('lesson')) : null;
if (isNaN(lessonId)) lessonId = null;
let   startSegId  = params.get('seg') ? parseInt(params.get('seg')) : null;
if (isNaN(startSegId)) startSegId = null;
const labelFilter = params.get('label') ? decodeURIComponent(params.get('label')) : null;

// ─── State ──────────────────────────────────────
let allSegments  = [];
let allBooks     = [];
let allLessons   = [];
let currentIdx   = 0;
let sessionScore = { correct: 0, total: 0 };
let timeInterval = null;

// Mode state
let currentMode  = 'check';   // 'check' | 'dictation' | 'full'
let audioSpeed   = 1;
let hidePercent  = 50;        // check mode: % of chars to hide
let revealedSet  = new Set(); // indices of revealed chars in check mode
let fullAutoPlay = true;
let fullHideScript = false;
let isPlaying    = false;

const audioEl = document.getElementById('main-audio');

// ─── INIT ───────────────────────────────────────
(async () => {
  try {
    const [{ data: books }, { data: lessons }] = await Promise.all([
      db.from('books').select('*').order('name'),
      db.from('lessons').select('id,title,book').order('id'),
    ]);
    allBooks   = books   || [];
    allLessons = lessons || [];

    if (bookName && lessonId) await loadExercise(bookName, lessonId);
    else if (bookName) await renderLessonList(bookName);
    else await renderBookList();
  } catch(e) {
    document.getElementById('app-main').innerHTML =
      `<div style="padding:3rem;text-align:center;color:#dc2626;font-size:13px">
        <i class="fas fa-exclamation-circle" style="font-size:24px;display:block;margin-bottom:10px"></i>
        Lỗi: ${e.message}
      </div>`;
  }
})();

function goBack() {
  if (lessonId) { lessonId = null; renderLessonList(bookName); }
  else if (bookName) { bookName = ''; renderBookList(); }
  else history.back();
}

// ─── BOOK LIST ──────────────────────────────────
async function renderBookList() {
  document.getElementById('page-h1').textContent = 'Luyện nghe & Chép chính tả';
  const { data: summary } = await db.from('audio_segments').select('book_name').eq('published', true);
  const booksWithAudio = new Set((summary||[]).map(s => s.book_name));
  document.getElementById('app-main').innerHTML = [...booksWithAudio].sort().map(name => {
    const meta = allBooks.find(b => b.name === name) || {};
    const cnt  = (summary||[]).filter(s => s.book_name === name).length;
    return `<div class="list-card" onclick="renderLessonList('${name}')">
      <div class="list-hd">
        <div class="list-num">${name.slice(0,2)}</div>
        <div class="list-info">
          <div class="list-title">${meta.display_name || name}</div>
          <div class="list-sub">${cnt} đoạn audio</div>
        </div>
        <i class="fas fa-chevron-right" style="color:#d1d5db;font-size:12px"></i>
      </div>
    </div>`;
  }).join('') || '<div class="loading-spinner">Chưa có bài nghe nào.</div>';
}

// ─── LESSON LIST ────────────────────────────────
async function renderLessonList(book) {
  bookName = book;
  const meta  = allBooks.find(b => b.name === book) || {};
  document.getElementById('page-h1').textContent = (meta.display_name || book) + ' · Luyện nghe';
  const { data: segs } = await db.from('audio_segments')
    .select('lesson_id,lesson_title').eq('book_name', book).eq('published', true);
  const lessonMap = new Map();
  (segs||[]).forEach(s => {
    if (!lessonMap.has(s.lesson_id)) lessonMap.set(s.lesson_id, { title: s.lesson_title, count: 0 });
    lessonMap.get(s.lesson_id).count++;
  });
  document.getElementById('app-main').innerHTML = [...lessonMap.entries()].map(([lid, info], i) => {
    const prog = getLessonProgress(book, lid);
    const pct  = info.count ? Math.round(prog / info.count * 100) : 0;
    return `<div class="list-card">
      <div class="list-hd" onclick="loadExercise('${book}',${lid})">
        <div class="list-num">${i+1}</div>
        <div class="list-info">
          <div class="list-title">${info.title || 'Bài học'}</div>
          <div class="list-sub">${info.count} đoạn · ${pct > 0 ? pct + '% hoàn thành' : 'Chưa học'}</div>
        </div>
        <span class="list-badge">${info.count} đoạn</span>
        <i class="fas fa-chevron-right" style="color:#d1d5db;font-size:12px;margin-left:6px"></i>
      </div>
      ${pct > 0 ? `<div class="list-prog"><div class="list-prog-fill" style="width:${pct}%"></div></div>` : ''}
    </div>`;
  }).join('') || '<div class="loading-spinner">Chưa có bài nghe nào.</div>';
}

// ─── LOAD EXERCISE ───────────────────────────────
async function loadExercise(book, lid) {
  bookName = book; lessonId = lid;
  currentIdx = 0; sessionScore = { correct: 0, total: 0 };

  let { data: segs, error } = await db.from('audio_segments')
    .select('*').eq('book_name', book).eq('lesson_id', lid)
    .eq('published', true).order('sort_order').order('id');

  if ((!segs || !segs.length) && !error) {
    const { data: all } = await db.from('audio_segments')
      .select('*').eq('book_name', book).eq('published', true).order('sort_order').order('id');
    segs = (all||[]).filter(s => s.lesson_id === lid || s.lesson_id == lid);
    if (!segs.length && all?.length) {
      const fid = all[0].lesson_id;
      segs = all.filter(s => s.lesson_id === fid);
    }
  }

  allSegments = segs || [];
  if (labelFilter) allSegments = allSegments.filter(s => s.item_label === labelFilter);

  if (startSegId) {
    const si = allSegments.findIndex(s => s.id === startSegId);
    if (si > -1) currentIdx = si;
    startSegId = null;
  }

  if (!allSegments.length) {
    document.getElementById('app-main').innerHTML = '<div class="loading-spinner">Bài học này chưa có audio.</div>';
    return;
  }

  const meta = allBooks.find(b => b.name === book) || {};
  const lessonTitle = allSegments[0]?.lesson_title || 'Bài học';
  document.getElementById('page-h1').textContent = (labelFilter ? labelFilter + ' · ' : '') + lessonTitle;
  document.getElementById('page-desc').textContent = `${allSegments.length} đoạn · ${meta.display_name || book}`;

  renderExercise(currentIdx);
}

// ─── RENDER EXERCISE ─────────────────────────────
function renderExercise(idx) {
  currentIdx = idx;
  if (idx >= allSegments.length) { renderDone(); return; }

  const seg = allSegments[idx];
  revealedSet = new Set();

  // Build mode tabs + card
  document.getElementById('app-main').innerHTML = `
    <div class="mode-tabs">
      <button class="mode-tab${currentMode==='check'?' active':''}" onclick="switchMode('check')">Nghe Check</button>
      <button class="mode-tab${currentMode==='dictation'?' active':''}" onclick="switchMode('dictation')">Nghe Chép</button>
      <button class="mode-tab${currentMode==='full'?' active':''}" onclick="switchMode('full')">Nghe Full</button>
    </div>
    <div id="ex-card-wrap"></div>
    ${currentMode === 'full' ? '<div id="ex-full-extra"></div>' : ''}
  `;

  renderCard(seg);

  // Auto-play after short delay
  setTimeout(() => playSegment(seg), 300);
}

function switchMode(mode) {
  currentMode = mode;
  renderExercise(currentIdx);
}

function renderCard(seg) {
  const isCheck = currentMode === 'check';
  const isDictation = currentMode === 'dictation';
  const isFull = currentMode === 'full';
  const total = allSegments.length;
  const n = currentIdx + 1;

  const navHTML = `
    <div class="ex-nav">
      <div class="ex-nav-left">
        <button class="nav-icon-btn" onclick="goSeg(${currentIdx-1})" ${currentIdx===0?'disabled':''} title="Câu trước">
          <i class="fas fa-chevron-left"></i>
        </button>
        <button class="nav-icon-btn" id="nav-play-btn" onclick="togglePlay()" title="Phát/Dừng">
          <i class="fas fa-${isPlaying?'pause':'play'}" id="nav-play-icon"></i>
        </button>
        <button class="nav-icon-btn" onclick="goSeg(${currentIdx+1})" ${currentIdx>=total-1?'disabled':''} title="Câu tiếp">
          <i class="fas fa-chevron-right"></i>
        </button>
        <span class="nav-counter">${n} / ${total}</span>
        <button class="nav-speed-btn" onclick="cycleSpeed()" title="Tốc độ phát">
          <span id="speed-label">${audioSpeed}x</span>
        </button>
        <button class="nav-icon-btn" onclick="replayAudio()" title="Phát lại">
          <i class="fas fa-rotate-right"></i>
        </button>
      </div>
      <div class="ex-nav-right">
        ${isCheck || isDictation ? `<button class="nav-icon-btn" onclick="showHint()" title="Gợi ý"><i class="fas fa-triangle-exclamation" style="color:#f59e0b"></i></button>` : ''}
        <button class="nav-icon-btn" title="Ghi chú"><i class="far fa-file" style="color:#9ca3af"></i></button>
      </div>
    </div>`;

  let bodyHTML = '';

  if (isCheck) {
    bodyHTML = buildCheckBody(seg);
  } else if (isDictation) {
    bodyHTML = buildDictationBody(seg);
  } else {
    bodyHTML = buildFullBody(seg);
  }

  document.getElementById('ex-card-wrap').innerHTML = `<div class="ex-card">${navHTML}${bodyHTML}</div>`;

  if (isFull) {
    document.getElementById('ex-full-extra').innerHTML = buildFullExtra(seg);
  }

  // Bind events after render
  if (isDictation) {
    const ta = document.getElementById('dictation-input');
    if (ta) {
      ta.focus();
      ta.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); checkDictation(); }
        if (e.key === 'Tab') { e.preventDefault(); hintDictation(); }
      });
      ta.addEventListener('input', updateScoreLive);
    }
  }
  if (isCheck) {
    document.addEventListener('keydown', handleCheckKey);
  }
}

// ─── NGHE CHECK ──────────────────────────────────
function buildCheckBody(seg) {
  const chars = tokenize(seg.transcript || '');
  // Initially hide hidePercent% of chars randomly
  const hideCount = Math.round(chars.length * hidePercent / 100);
  // Pick random indices to hide (if revealedSet is empty = first render)
  if (revealedSet.size === 0) {
    const indices = chars.map((_,i)=>i).sort(()=>Math.random()-.5).slice(0, hideCount);
    indices.forEach(i => {/* hiddenIndices tracked via NOT in revealedSet */});
    // Store which should start as HIDDEN
    window._hiddenIndices = new Set(indices);
  }

  const speedLabel = hidePercent === 30 ? '30%' : hidePercent === 50 ? '50%' : '100%';

  return `
    <div class="speed-row">
      <span class="speed-row-label">Ẩn từ:</span>
      <button class="speed-pill${hidePercent===30?' active':''}" onclick="setHidePercent(30)">30%</button>
      <button class="speed-pill${hidePercent===50?' active':''}" onclick="setHidePercent(50)">50%</button>
      <button class="speed-pill${hidePercent===100?' active':''}" onclick="setHidePercent(100)">100%</button>
    </div>
    <div class="check-body">
      <div class="word-display" id="word-display">${renderWordDisplay(chars)}</div>
      <div class="reveal-row">
        <button class="reveal-btn" onclick="revealChars(1)"><i class="far fa-eye"></i> 1 từ</button>
        <button class="reveal-btn" onclick="revealChars(2)"><i class="far fa-eye"></i> 2 từ</button>
        <button class="reveal-btn" onclick="revealChars(3)"><i class="far fa-eye"></i> 3 từ</button>
        <button class="reveal-btn" onclick="revealChars(Infinity)" style="background:#f8faff;border-color:#c7d7fd;color:var(--blue)">Tất cả</button>
        <span class="reveal-sep">·</span>
        <button class="reset-btn" onclick="resetReveal()"><i class="fas fa-rotate"></i> Reset</button>
      </div>
    </div>
    <div class="kbd-hint">
      <kbd class="kbd">Ctrl</kbd> phát lại &nbsp;·&nbsp;
      <kbd class="kbd">Tab</kbd> lật từ &nbsp;·&nbsp;
      <kbd class="kbd">Enter</kbd> câu tiếp theo
    </div>`;
}

function tokenize(text) {
  // Split into individual chars; keep punctuation as separate tokens
  return [...text.trim()].filter(c => c !== ' ' || true);
}

function renderWordDisplay(chars) {
  return chars.map((ch, i) => {
    const hidden = window._hiddenIndices?.has(i) && !revealedSet.has(i);
    if (hidden) {
      const w = Math.max(18, ch === '，' || ch === '。' ? 14 : 22);
      return `<span class="word-box" style="width:${w}px" onclick="revealOne(${i})" title="Click để xem"></span>`;
    }
    const isPunct = /[，。！？、：；""''「」…]/.test(ch);
    return `<span class="word-token${isPunct?' punct':''}">${ch}</span>`;
  }).join('');
}

function revealChars(n) {
  const chars = tokenize(allSegments[currentIdx]?.transcript || '');
  const hidden = [...(window._hiddenIndices || [])].filter(i => !revealedSet.has(i));
  const toReveal = hidden.sort(() => Math.random()-.5).slice(0, n === Infinity ? hidden.length : n);
  toReveal.forEach(i => revealedSet.add(i));
  document.getElementById('word-display').innerHTML = renderWordDisplay(chars);
}

function revealOne(i) {
  revealedSet.add(i);
  const chars = tokenize(allSegments[currentIdx]?.transcript || '');
  document.getElementById('word-display').innerHTML = renderWordDisplay(chars);
}

function resetReveal() {
  revealedSet = new Set();
  const seg = allSegments[currentIdx];
  const chars = tokenize(seg?.transcript || '');
  const hideCount = Math.round(chars.length * hidePercent / 100);
  const indices = chars.map((_,i)=>i).sort(()=>Math.random()-.5).slice(0, hideCount);
  window._hiddenIndices = new Set(indices);
  document.getElementById('word-display').innerHTML = renderWordDisplay(chars);
}

function setHidePercent(pct) {
  hidePercent = pct;
  renderExercise(currentIdx);
}

function handleCheckKey(e) {
  if (e.key === 'Enter') { document.removeEventListener('keydown', handleCheckKey); goSeg(currentIdx+1); }
  if (e.key === 'Tab') { e.preventDefault(); revealChars(1); }
  if (e.ctrlKey) { e.preventDefault(); replayAudio(); }
}

// ─── NGHE CHÉP ───────────────────────────────────
let dictationHintCount = 0;

function buildDictationBody(seg) {
  const chars = [...(seg.transcript || '').replace(/\s/g,'')];
  const dotsHTML = buildDots(seg.transcript || '');
  return `
    <div class="speed-row">
      <span class="speed-row-label">Ẩn từ:</span>
      <button class="speed-pill${hidePercent===30?' active':''}" onclick="setHidePercent(30)">30%</button>
      <button class="speed-pill${hidePercent===50?' active':''}" onclick="setHidePercent(50)">50%</button>
      <button class="speed-pill${hidePercent===100?' active':''}" onclick="setHidePercent(100)">100%</button>
    </div>
    <div class="dictation-body">
      <textarea class="dictation-input" id="dictation-input" rows="2"
        placeholder="Gõ câu trả lời của bạn ở đây..."></textarea>
      <div class="score-row">
        <span class="score-text" id="score-text">0 / ${chars.length} từ đúng</span>
        <span class="score-pct" id="score-pct">0%</span>
      </div>
      <div class="dots-row" id="dots-row">${dotsHTML}</div>
    </div>
    <div class="kbd-hint">
      <kbd class="kbd">Ctrl</kbd> phát lại &nbsp;·&nbsp;
      <kbd class="kbd">Tab</kbd> gợi ý từ &nbsp;·&nbsp;
      <kbd class="kbd">Enter</kbd> kiểm tra
    </div>`;
}

function buildDots(transcript) {
  const chars = [...transcript.trim()];
  // Group into "words" — for Chinese, treat clusters separated by spaces or punctuation
  const groups = transcript.trim().split(/(?=[，。！？、：；\s])|(?<=[，。！？、：；\s])/)
    .map(s => [...s.replace(/\s/g,'')].filter(c => c))
    .filter(g => g.length);
  if (!groups.length) return '';
  return groups.map(g => `<span class="dot-group">${g.map(()=>'<span class="dot"></span>').join('')}</span>`).join('');
}

function updateScoreLive() {
  const seg = allSegments[currentIdx];
  if (!seg) return;
  const correct = [...(seg.transcript||'').replace(/\s/g,'')];
  const user    = [...(document.getElementById('dictation-input')?.value||'').replace(/\s/g,'')];
  let ok = 0;
  correct.forEach((ch, i) => { if (user[i] === ch) ok++; });
  const pct = correct.length ? Math.round(ok / correct.length * 100) : 0;
  const scoreEl = document.getElementById('score-text');
  const pctEl   = document.getElementById('score-pct');
  if (scoreEl) scoreEl.textContent = `${ok} / ${correct.length} từ đúng`;
  if (pctEl)   pctEl.textContent   = pct + '%';

  // Update dots
  const groups = (seg.transcript||'').trim().split(/(?=[，。！？、：；\s])|(?<=[，。！？、：；\s])/)
    .map(s => [...s.replace(/\s/g,'')].filter(c=>c)).filter(g=>g.length);
  let charIdx = 0;
  const dotsEl = document.getElementById('dots-row');
  if (dotsEl) {
    dotsEl.innerHTML = groups.map(g => {
      const dotHTML = g.map(ch => {
        const u = user[charIdx++];
        const cls = u === undefined ? '' : u === ch ? 'correct' : 'wrong';
        return `<span class="dot ${cls}"></span>`;
      }).join('');
      return `<span class="dot-group">${dotHTML}</span>`;
    }).join('');
  }
}

function checkDictation() {
  const seg   = allSegments[currentIdx];
  const input = document.getElementById('dictation-input')?.value || '';
  if (!input.trim()) { replayAudio(); return; }
  showDictationResult(seg, input);
}

function hintDictation() {
  const seg    = allSegments[currentIdx];
  const chars  = [...(seg.transcript||'').replace(/\s/g,'')];
  const ta     = document.getElementById('dictation-input');
  if (!ta) return;
  const user   = [...ta.value.replace(/\s/g,'')];
  // Find first wrong/missing char
  const nextIdx = user.findIndex((c,i) => c !== chars[i]);
  const fillTo  = nextIdx === -1 ? user.length : nextIdx;
  ta.value = chars.slice(0, fillTo + 1).join('');
  updateScoreLive();
}

function showDictationResult(seg, userInput) {
  const correct = [...(seg.transcript||'').replace(/\s/g,'')];
  const user    = [...userInput.replace(/\s/g,'')];
  let ok = 0;
  const cellsHTML = correct.map((ch, i) => {
    const uch = user[i] || '';
    const isOk = uch === ch;
    if (isOk) ok++;
    const cls = !uch ? 'char-miss' : isOk ? 'char-ok' : 'char-err';
    return `<span style="display:inline-flex;flex-direction:column;align-items:center;gap:2px;min-width:30px;padding:4px 5px;border-radius:6px;background:${isOk?'#f0fdf4':!uch?'#f9fafb':'#fef2f2'}">
      <span style="font-family:'Noto Serif TC',serif;font-size:20px;font-weight:700;color:${isOk?'var(--green)':!uch?'#9ca3af':'var(--red)'}">${ch}</span>
      ${uch ? `<span style="font-size:11px;color:${isOk?'var(--green)':'var(--red)'};border-top:1px solid currentColor;width:100%;text-align:center;padding-top:2px">${uch}</span>` : ''}
    </span>`;
  }).join('');

  const pct = correct.length ? Math.round(ok / correct.length * 100) : 0;
  const msg = pct === 100 ? '🎉 Hoàn hảo!' : pct >= 70 ? '👍 Khá tốt!' : '💪 Cố gắng hơn!';
  sessionScore.correct += (pct === 100 ? 1 : 0);
  sessionScore.total++;
  saveProgress(bookName, lessonId, seg.id, pct);

  // Replace card body with result
  document.getElementById('ex-card-wrap').insertAdjacentHTML('afterend', `
    <div class="ex-card" style="margin-top:12px;padding:18px 20px;animation:fadeIn .25s ease" id="result-card">
      <div style="margin-bottom:12px">
        <div style="font-size:10px;font-weight:700;letter-spacing:1px;color:var(--text-3);text-transform:uppercase;margin-bottom:8px">Đáp án đúng</div>
        <div style="font-family:'Noto Serif TC',serif;font-size:20px;font-weight:700;color:var(--navy);letter-spacing:.5px">${seg.transcript}</div>
        ${seg.meaning_vi ? `<div style="font-size:13px;color:var(--text-2);margin-top:6px;font-style:italic">${seg.meaning_vi}</div>` : ''}
      </div>
      <div style="margin-bottom:14px">
        <div style="font-size:10px;font-weight:700;letter-spacing:1px;color:var(--text-3);text-transform:uppercase;margin-bottom:10px">So sánh từng chữ</div>
        <div style="display:flex;flex-wrap:wrap;gap:5px">${cellsHTML}</div>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;background:${pct===100?'var(--green-lt)':pct>=70?'var(--blue-lt)':'var(--red-lt)'};color:${pct===100?'var(--green)':pct>=70?'var(--blue)':'var(--red)'}">${pct}%</div>
          <div>
            <div style="font-size:13px;font-weight:600">${msg}</div>
            <div style="font-size:12px;color:var(--text-2)">${ok}/${correct.length} ký tự đúng</div>
          </div>
        </div>
        <div style="display:flex;gap:8px">
          <button onclick="document.getElementById('result-card')?.remove();renderExercise(${currentIdx})"
            style="padding:9px 16px;border-radius:8px;border:1.5px solid var(--blue);background:transparent;color:var(--blue);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer">
            <i class="fas fa-rotate-left"></i> Thử lại
          </button>
          <button onclick="goSeg(${currentIdx+1})"
            style="padding:9px 18px;border-radius:8px;border:none;background:var(--navy);color:#fff;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer">
            ${currentIdx+1 < allSegments.length ? 'Tiếp <i class="fas fa-arrow-right"></i>' : '🏁 Kết thúc'}
          </button>
        </div>
      </div>
    </div>
  `);
  document.getElementById('result-card')?.scrollIntoView({ behavior:'smooth', block:'nearest' });
}

// ─── NGHE FULL ───────────────────────────────────
function buildFullBody(seg) {
  const n = currentIdx + 1, total = allSegments.length;
  return `
    <div class="full-player">
      <div class="full-btns">
        <button class="full-prev-btn" onclick="goSeg(${currentIdx-1})" ${currentIdx===0?'disabled':''}>
          <i class="fas fa-backward-step"></i>
        </button>
        <button class="full-play-btn" id="full-play-btn" onclick="togglePlay()">
          <i class="fas fa-${isPlaying?'pause':'play'}" id="full-play-icon"></i>
        </button>
        <button class="full-next-btn" onclick="goSeg(${currentIdx+1})" ${currentIdx>=total-1?'disabled':''}>
          <i class="fas fa-forward-step"></i>
        </button>
      </div>
      <div class="full-counter">Câu <strong>${n}</strong> / ${total} &nbsp;·</div>
      <div class="full-ctrl-row">
        <button class="full-ctrl-btn" onclick="goSeg(0)"><i class="fas fa-rotate-left"></i> Từ đầu</button>
        <button class="full-ctrl-btn${fullAutoPlay?' on':''}" id="auto-play-btn" onclick="toggleAutoPlay()">
          <i class="fas fa-${fullAutoPlay?'circle-check':'circle'}"></i> Tự động phát: ${fullAutoPlay?'Bật':'Tắt'}
        </button>
        <button class="full-ctrl-btn${fullHideScript?' on':''}" id="hide-script-btn" onclick="toggleScript()">
          <i class="fas fa-${fullHideScript?'eye-slash':'eye'}"></i> ${fullHideScript?'Hiện':'Ẩn'} script
        </button>
        <button class="full-ctrl-btn nav-speed-btn" onclick="cycleSpeed()" style="min-width:52px">
          <span id="full-speed-label">${audioSpeed}x</span>
        </button>
      </div>
    </div>`;
}

function buildFullExtra(seg) {
  const transcriptBlock = fullHideScript
    ? `<div style="font-size:13px;color:var(--text-3);font-style:italic;text-align:center;padding:1rem 0">Script đang ẩn — nhấn "Hiện script" để xem</div>`
    : `<div class="tc-text">${seg.transcript || ''}</div>
       ${seg.meaning_vi ? `<div class="tc-vi-label">Dịch nghĩa</div><div class="tc-vi-text">${seg.meaning_vi}</div>` : ''}`;

  const circles = allSegments.map((_, i) => {
    const done = getLessonProgress(bookName, lessonId) > i;
    const cls  = i === currentIdx ? 'active' : done ? 'done' : '';
    return `<div class="sl-circle ${cls}" onclick="goSeg(${i})">${i+1}</div>`;
  }).join('');

  return `
    <div class="transcript-card">
      <div class="tc-label">Transcript</div>
      ${transcriptBlock}
    </div>
    <div class="seg-list-card">
      <div class="sl-label">Danh sách câu</div>
      <div class="sl-circles">${circles}</div>
    </div>`;
}

function toggleAutoPlay() {
  fullAutoPlay = !fullAutoPlay;
  const btn = document.getElementById('auto-play-btn');
  if (btn) {
    btn.className = 'full-ctrl-btn' + (fullAutoPlay ? ' on' : '');
    btn.innerHTML = `<i class="fas fa-${fullAutoPlay?'circle-check':'circle'}"></i> Tự động phát: ${fullAutoPlay?'Bật':'Tắt'}`;
  }
}

function toggleScript() {
  fullHideScript = !fullHideScript;
  const extra = document.getElementById('ex-full-extra');
  if (extra) extra.innerHTML = buildFullExtra(allSegments[currentIdx]);
}

// ─── HINT / SHOW ─────────────────────────────────
function showHint() {
  const seg = allSegments[currentIdx];
  if (!seg) return;
  const hint = [
    seg.pinyin ? `<b>Pinyin:</b> ${seg.pinyin}` : '',
    `<b>Ký tự:</b> ${[...(seg.transcript||'').replace(/\s/g,'')].length} chữ`,
  ].filter(Boolean).join('&emsp;');
  alert(hint || 'Không có gợi ý.');
}

// ─── AUDIO CONTROL ───────────────────────────────
function playSegment(seg) {
  if (!seg) return;
  if (audioEl.src !== seg.audio_url) { audioEl.src = seg.audio_url; audioEl.load(); }
  audioEl.playbackRate = audioSpeed;
  audioEl.currentTime = seg.start_sec;
  audioEl.play().catch(()=>{});
  isPlaying = true;
  updatePlayIcons();
  clearInterval(timeInterval);
  timeInterval = setInterval(() => {
    if (!allSegments[currentIdx]) { clearInterval(timeInterval); return; }
    const s = allSegments[currentIdx];
    if (audioEl.currentTime >= s.end_sec) {
      audioEl.pause();
      clearInterval(timeInterval);
      isPlaying = false;
      updatePlayIcons();
      if (currentMode === 'full' && fullAutoPlay && currentIdx + 1 < allSegments.length) {
        setTimeout(() => goSeg(currentIdx + 1), 600);
      }
    }
  }, 80);
}

function togglePlay() {
  const seg = allSegments[currentIdx];
  if (!seg) return;
  if (isPlaying) {
    audioEl.pause();
    clearInterval(timeInterval);
    isPlaying = false;
    updatePlayIcons();
  } else {
    playSegment(seg);
  }
}

function replayAudio() {
  playSegment(allSegments[currentIdx]);
}

function updatePlayIcons() {
  const icon = isPlaying ? 'fa-pause' : 'fa-play';
  ['nav-play-icon','full-play-icon'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.className = 'fas ' + icon;
  });
}

function cycleSpeed() {
  const speeds = [0.5, 0.75, 1, 1.25, 1.5];
  const idx = speeds.indexOf(audioSpeed);
  audioSpeed = speeds[(idx + 1) % speeds.length];
  audioEl.playbackRate = audioSpeed;
  ['speed-label','full-speed-label'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.textContent = audioSpeed + 'x';
  });
}

function goSeg(idx) {
  if (idx < 0 || idx > allSegments.length) return;
  document.removeEventListener('keydown', handleCheckKey);
  clearInterval(timeInterval);
  isPlaying = false;
  renderExercise(idx);
}

// ─── DONE ────────────────────────────────────────
function renderDone() {
  const total   = sessionScore.total;
  const correct = sessionScore.correct;
  const pct     = total ? Math.round(correct / total * 100) : 0;
  document.getElementById('app-main').innerHTML = `
    <div class="done-card">
      <div style="font-size:56px;margin-bottom:1rem">🎉</div>
      <div class="done-score">${pct}%</div>
      <div style="font-size:16px;font-weight:600;margin-bottom:.5rem">Hoàn thành bài luyện!</div>
      <div style="font-size:14px;color:var(--text-2);margin-bottom:2rem">${correct}/${total} đoạn hoàn hảo</div>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button onclick="loadExercise('${bookName}',${lessonId})"
          style="background:var(--navy);color:#fff;border:none;padding:11px 24px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit">
          <i class="fas fa-rotate-left"></i> Học lại
        </button>
        <button onclick="renderLessonList('${bookName}')"
          style="background:transparent;color:var(--navy);border:1.5px solid var(--navy);padding:11px 20px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit">
          <i class="fas fa-list"></i> Chọn bài khác
        </button>
      </div>
    </div>`;
}

// ─── PROGRESS ────────────────────────────────────
function progressKey(book, lid) { return `ls_prog_${book}_${lid}`; }

function getLessonProgress(book, lid) {
  return JSON.parse(localStorage.getItem(progressKey(book, lid)) || '[]').length;
}

function saveProgress(book, lid, segId, scorePct) {
  const key  = progressKey(book, lid);
  const done = new Set(JSON.parse(localStorage.getItem(key) || '[]'));
  done.add(segId);
  localStorage.setItem(key, JSON.stringify([...done]));
  if (window.userSession?.uid) {
    window.userSession.saveListeningResult(book, lid, segId, scorePct || 0);
  }
}

// ─── UTILS ──────────────────────────────────────
function formatTime(sec) {
  const s = Math.floor(sec || 0);
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}
